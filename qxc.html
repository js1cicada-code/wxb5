<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>七星彩选号</title><style>/* ========== CSS变量定义 ========== */
        /* 使用CSS变量可以方便地统一管理颜色、间距等样式 */
        :root {
            --primary: #8b5cf6;        /* 主色调：紫色 */
            --primary-dark: #7c3aed;   /* 主色调深色版本 */
            --primary-light: #a78bfa;  /* 主色调浅色版本 */
            --secondary: #ec4899;      /* 次要色：粉色（用于特别号） */
            --secondary-dark: #db2777; /* 次要色深色版本 */
            --accent: #fbbf24;         /* 强调色：金色 */
            --success: #10b981;        /* 成功状态：绿色 */
            --danger: #ef4444;         /* 危险状态：红色 */
            --warning: #f59e0b;        /* 警告状态：橙色 */
            --bg-main: #f5f5f5;        /* 主背景色 */
            --bg-card: #ffffff;        /* 卡片背景色 */
            --bg-elevated: #fafafa;    /* 凸起元素背景色 */
            --text-primary: #1f2937;   /* 主要文字颜色 */
            --text-secondary: #6b7280; /* 次要文字颜色 */
            --text-muted: #9ca3af;     /* 弱化文字颜色 */
            --border-light: #f0f0f0;   /* 浅色边框 */
            --border-medium: #e5e7eb;  /* 中等边框颜色 */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);   /* 小阴影 */
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);   /* 中等阴影 */
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);  /* 大阴影 */
            --radius-sm: 4px;   /* 小圆角 */
            --radius-md: 8px;   /* 中等圆角 */
            --radius-lg: 12px;  /* 大圆角 */
            --transition-fast: 150ms ease;    /* 快速过渡动画 */
            --transition-normal: 200ms ease;  /* 普通过渡动画 */
            --transition-slow: 300ms ease;    /* 慢速过渡动画 */
        }
        
        /* ========== 基础样式重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; min-height: 100vh; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        
        /* ========== 顶部导航栏样式 ========== */
        /* 使用渐变色作为背景，固定在页面顶部 */
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 0 12px; height: 54px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
        
        /* 返回按钮：使用CSS伪元素画一个箭头 */
        .header-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .header-content { flex: 1; text-align: center; }
        .header h1 { color: #fff; font-size: 17px; font-weight: 600; line-height: 1.2; }
        .header-time { color: rgba(255,255,255,0.85); font-size: 11px; margin-top: 2px; }
        
        /* 标题区域居中显示 */
        .header-content { flex: 1; text-align: center; }
        
        /* 彩种选择器：点击可展开下拉菜单 */
        
        
        /* ========== 期号信息栏 ========== */
        .period-bar { background: var(--bg-card); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .period-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .period-label span { color: var(--primary); font-weight: 700; }
        .deadline { font-size: 12px; color: var(--danger); font-weight: 500; }
        .history-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 6px 12px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); transition: all var(--transition-fast); font-weight: 500; }
        .history-btn:hover { border-color: var(--primary); color: var(--primary); }
        
        /* ========== 主内容区域 ========== */
        .main-content { padding: 12px; padding-bottom: 200px; } /* 底部留出足够空间给投注栏 */
        
        /* 机选按钮组 */
        .quick-picks { display: flex; gap: 8px; margin-bottom: 12px; }
        .quick-pick-btn { flex: 1; padding: 10px 0; background: var(--bg-card); border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-size: 13px; color: var(--text-primary); cursor: pointer; transition: all var(--transition-fast); font-weight: 500; }
        .quick-pick-btn:hover { border-color: var(--primary); color: var(--primary); }
        .quick-pick-btn:active { background: var(--bg-elevated); }
        
        /* 号码选择区域卡片 */
        .section { background: var(--bg-card); border-radius: var(--radius-md); margin-bottom: 10px; padding: 12px; box-shadow: var(--shadow-sm); }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .section-title { font-size: 14px; color: var(--text-primary); font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .section-title .badge { font-size: 11px; padding: 2px 6px; border-radius: var(--radius-sm); font-weight: 500; }
        .section-title .badge.normal { background: #f3e8ff; color: var(--primary); }
        .section-clear { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .section-clear:hover { color: var(--primary); background: var(--bg-elevated); }
        
        /* 每个位置的选号区域 */
        .position-section { margin-bottom: 10px; }
        .position-section:last-child { margin-bottom: 0; }
        .position-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .position-label .special { font-size: 10px; color: var(--secondary); background: #fce7f3; padding: 1px 4px; border-radius: 3px; }
        
        /* 号球网格：10列布局 */
        .number-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
        
        /* 号球样式 */
        .number-ball { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: 50%; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all var(--transition-normal); user-select: none; -webkit-tap-highlight-color: transparent; }
        .number-ball:hover { border-color: var(--primary); color: var(--text-primary); }
        .number-ball:active { transform: scale(0.95); } /* 点击时缩小效果 */
        /* 选中状态：使用渐变背景 */
        .number-ball.selected { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3); }
        /* 特别号（第七位）使用粉色 */
        .number-ball.selected.last { background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%); border-color: var(--secondary); box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3); }
        
        /* ========== 底部投注栏 ========== */
        /* 固定在页面底部，用户选择号码后显示 */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); padding: 12px; display: none; transform: translateY(100%); transition: transform var(--transition-slow); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .bottom-bar.show { display: block; transform: translateY(0); }
        
        /* 投注信息区 */
        .bet-info { display: flex; align-items: center; justify-content: space-between; }
        .bet-stats { display: flex; flex-direction: column; gap: 2px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .bet-tip { font-size: 11px; color: var(--text-muted); }
        
        /* 清空按钮 */
        .clear-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 8px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); display: flex; align-items: center; gap: 4px; transition: all var(--transition-fast); font-weight: 500; }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
        .clear-btn svg { width: 14px; height: 14px; }
        
        /* 投注额外信息区 */
        .bet-extra { display: none; padding-top: 12px; border-top: 1px solid var(--border-light); margin-top: 10px; }
        .bet-extra.show { display: block; }
        
        /* 投注金额汇总 */
        .bet-summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
        .bet-summary-item .label { color: var(--text-secondary); }
        .bet-summary-item span:not(.label) { color: var(--primary); font-weight: 700; }
        
        /* 倍数选择区 */
        .times-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .times-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .times-control { display: flex; align-items: center; gap: 10px; }
        .times-btn { width: 32px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--text-secondary); font-weight: 600; line-height: 30px; text-align: center; transition: all var(--transition-fast); }
        .times-btn:hover { border-color: var(--primary); color: var(--primary); }
        .times-btn:active { background: var(--bg-elevated); transform: scale(0.95); }
        .times-input { width: 56px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-primary); background: var(--bg-card); transition: border-color var(--transition-fast); }
        .times-input:focus { border-color: var(--primary); outline: none; }
        
        /* 确认投注按钮 */
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3); }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* ========== 历史开奖弹窗 ========== */
        /* 使用模态框展示历史开奖数据 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; opacity: 0; transition: opacity var(--transition-normal); backdrop-filter: blur(2px); }
        .modal.show { display: flex; align-items: flex-end; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-height: 80vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; transform: translateY(100%); transition: transform var(--transition-slow) cubic-bezier(0.16, 1, 0.3, 1); }
        .modal.show .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-light); }
        .modal-header h3 { font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .modal-header .close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .modal-header .close:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .modal-body { padding: 16px; max-height: 60vh; overflow-y: auto; }
        
        /* 历史开奖记录项 */
        .history-item { padding: 12px 0; border-bottom: 1px solid var(--border-light); }
        .history-item:last-child { border-bottom: none; }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .history-period { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .history-date { font-size: 11px; color: var(--text-muted); }
        .history-balls { display: flex; gap: 4px; flex-wrap: wrap; }
        .history-ball { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 11px; font-weight: 600; color: #fff; }
        .history-ball.normal { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
        .history-ball.last { background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%); }
        
        /* 加载状态提示 */
        .loading { text-align: center; padding: 20px; color: var(--text-muted); }
        
        /* Toast提示消息：用于短暂显示操作反馈 */
        .toast-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 13px; z-index: 9999; opacity: 0; visibility: hidden; transition: all var(--transition-fast); }
        .toast-msg.show { opacity: 1; visibility: visible; }
        
        @media (min-width: 768px) {
            body { background: linear-gradient(135deg, #f0f0f0 0%, #e5e5e5 100%); min-height: 100vh; }
            .header { max-width: 1200px; margin: 16px auto 0; border-radius: var(--radius-lg); }
            .period-bar { max-width: 1200px; margin: 0 auto; border-radius: var(--radius-md); }
            .main-content { max-width: 1200px; margin: 0 auto; padding: 16px; }
            .bottom-bar { max-width: 1200px; margin: 0 auto 16px; border-radius: var(--radius-lg); }
            .modal.show { align-items: center; justify-content: center; }
            .modal-content { max-width: 500px; border-radius: var(--radius-lg); }
        }.header-time{color:rgba(255,255,255,0.85);font-size:11px;margin-top:2px}.header-link{color:#fff;font-size:13px;padding:6px 12px;background:rgba(255,255,255,0.15);border-radius:var(--radius-md);text-decoration:none;transition:all var(--transition-fast)}.header-link:hover{background:rgba(255,255,255,0.25)}</style><script defer=defer src=/js/vendors.193db0f8.js></script><script defer=defer src=/js/main.132476e8.js></script><link href=/css/main.eff2b279.css rel=stylesheet></head><body><div class=header><div class=header-back onclick="window.location.href='index.html'"></div><div class=header-content><h1>七星彩</h1><div class=header-time id=header-time></div></div><a href="qxc_chart.html" class=header-link>走势图</a></div><div class=period-bar><div><div class=period-label>第 <span id=current-period>--</span> 期</div><div class=deadline id=deadline>截止时间：--</div></div><button class=history-btn onclick=showHistory()>历史开奖</button></div><div class=main-content><div class=quick-picks><button class=quick-pick-btn onclick=randomPick(1)>机选1注</button> <button class=quick-pick-btn onclick=randomPick(5)>机选5注</button> <button class=quick-pick-btn onclick=randomPick(10)>机选10注</button></div><div class=section><div class=section-header><div class=section-title>七星彩号码 <span class="badge normal" id=select-count>0/7</span></div><div class=section-clear onclick=clearSelection()>清空</div></div><div id=positions-container></div></div></div><div class=bottom-bar id=bottom-bar><div class=bet-info><div class=bet-stats><div class=bet-amount>已选 <span id=bet-count>0</span> 注</div><div class=bet-tip id=bet-tip>请选择号码</div></div><button class=clear-btn id=clear-btn onclick=clearSelection()><svg viewBox="0 0 24 24" fill=currentColor><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg> 清空</button></div><div class="bet-extra show"><div class=bet-summary><div class=bet-summary-item><span class=label>投注金额：</span><span id=bet-money>0</span> 元</div></div><div class=times-row><div class=times-label>投注倍数</div><div class=times-control><button class=times-btn onclick=changeTimes(-1)>-</button> <input type=number class=times-input id=times-input value=1 min=1 max=99 onchange=updateTimes()> <button class=times-btn onclick=changeTimes(1)>+</button></div></div><button class=submit-btn id=submit-btn disabled=disabled onclick=submitBet()>确认选号</button></div></div><div class=modal id=history-modal onclick="if(event.target===this)closeModal()"><div class=modal-content><div class=modal-header><h3>历史开奖</h3><span class=close onclick=closeModal()>&times;</span></div><div class=modal-body><div class=loading id=history-loading>加载中...</div><div id=history-list></div></div></div></div><div class=toast-msg id=toast></div><script>/* ========== 常量定义 ========== */
// 七星彩规则：7个位置，每个位置可选0-9，每注2元
const POSITION_COUNT = 7;  // 七星彩有7个位置
const NUMBER_MAX = 9;      // 每个位置可选0-9共10个数字
const PRICE = 2;           // 每注2元

// 7个位置的名称
const positionNames = ['第一位', '第二位', '第三位', '第四位', '第五位', '第六位', '第七位'];

/* ========== 变量定义 ========== */
// sel: 存储用户选择的号码，每个位置是一个数组（支持复式）
// 例如：sel[0] = [1, 3, 5] 表示第一位选了1、3、5
const sel = Array(POSITION_COUNT).fill(null).map(() => []);
let times = 1;  // 投注倍数，默认1倍

/* ========== 初始化函数 ========== */
// 页面加载完成后执行
function init() { updateTime();
    renderPositions();  // 渲染7个位置的选号区域
    fetchData();         // 从服务器获取期号信息
}

/* ========== 渲染选号区域 ========== */
// 动态生成7个位置的号码球
function renderPositions() {
    const container = document.getElementById('positions-container');
    let html = '';
    
    // 循环生成7个位置
    for (let i = 0; i < POSITION_COUNT; i++) {
        const isLast = i === POSITION_COUNT - 1;  // 第七位是特别号
        // 每个位置包含：位置名称标签 + 号码网格
        html += `<div class="position-section">
            <div class="position-label">${positionNames[i]}${isLast ? '<span class="special">特别号</span>' : ''}</div>
            <div class="number-grid" id="pos-${i}"></div>
        </div>`;
    }
    container.innerHTML = html;
    
    // 为每个位置生成0-9的号码球
    for (let i = 0; i < POSITION_COUNT; i++) {
        const grid = document.getElementById(`pos-${i}`);
        const isLast = i === POSITION_COUNT - 1;  // 第七位使用不同颜色
        let ballHtml = '';
        
        // 生成0-9共10个号码球
        for (let n = 0; n <= NUMBER_MAX; n++) {
            // last类用于特别号的特殊样式
            ballHtml += `<div class="number-ball${isLast ? ' last' : ''}" data-pos="${i}" data-num="${n}">${n}</div>`;
        }
        grid.innerHTML = ballHtml;
        
        // 为每个号码球绑定点击事件
        grid.querySelectorAll('.number-ball').forEach(ball => {
            ball.addEventListener('click', () => selectNum(i, parseInt(ball.dataset.num)));
        });
    }
}

/* ========== 选择号码 ========== */
// pos: 位置索引(0-6)，num: 选择的数字(0-9)
function selectNum(pos, num) {
    const arr = sel[pos];  // 获取当前位置已选的号码
    const ball = document.querySelector(`#pos-${pos} [data-num="${num}"]`);
    
    // 如果已经选中，则取消选中
    if (arr.includes(num)) {
        arr.splice(arr.indexOf(num), 1);  // 从数组中移除
        ball.classList.remove('selected');
    } else {
        // 未选中则添加到数组
        arr.push(num);
        arr.sort((a, b) => a - b);  // 排序，保持数字有序
        ball.classList.add('selected');
    }
    updateUI();  // 更新界面显示
}

/* ========== 清空选择 ========== */
// 清空所有位置的号码选择
function clearSelection() {
    for (let i = 0; i < POSITION_COUNT; i++) {
        sel[i] = [];  // 清空该位置的数组
        // 移除所有号码球的选中样式
        document.querySelectorAll(`#pos-${i} .number-ball`).forEach(b => b.classList.remove('selected'));
    }
    updateUI();
}

/* ========== 更新界面显示 ========== */
// 计算注数和金额，更新底部投注栏
function updateUI() {
    let count = 1;         // 注数，初始为1（用于连乘）
    let selectedCount = 0; // 已选择的位置数量
    
    // 遍历7个位置计算注数
    for (let i = 0; i < POSITION_COUNT; i++) {
        if (sel[i].length > 0) {
            selectedCount++;
            count *= sel[i].length;  // 复式：每个位置的选择数相乘
        } else {
            count = 0;  // 只要有一个位置没选，注数为0
        }
    }
    
    // 计算金额 = 注数 × 单价 × 倍数
    const money = count * PRICE * times;
    
    // 更新界面元素
    document.getElementById('select-count').textContent = `${selectedCount}/7`;
    document.getElementById('bet-count').textContent = count;
    document.getElementById('bet-money').textContent = money;
    document.getElementById('submit-btn').disabled = count === 0;  // 没有有效注数时禁用按钮
    document.getElementById('bet-tip').textContent = count ? `合计 ${money} 元` : '请选择号码';
    document.getElementById('bottom-bar').classList.toggle('show', selectedCount > 0 || count > 0);
}

/* ========== 机选功能 ========== */
// n: 机选注数
function randomPick(n) {
    for (let i = 0; i < n; i++) {
        const nums = [];
        // 为每个位置随机选择一个数字
        for (let j = 0; j < POSITION_COUNT; j++) {
            nums.push(Math.floor(Math.random() * (NUMBER_MAX + 1)));  // 0-9的随机数
        }
        showToast(`机选: ${nums.join(' ')}`);
    }
}

/* ========== 倍数调整 ========== */
// d: 变化量，+1或-1
function changeTimes(d) {
    times = Math.max(1, Math.min(99, times + d));  // 限制在1-99之间
    document.getElementById('times-input').value = times;
    updateUI();
}

/* ========== 倍数输入框变化 ========== */
function updateTimes() {
    times = Math.max(1, Math.min(99, parseInt(document.getElementById('times-input').value) || 1));
    document.getElementById('times-input').value = times;
    updateUI();
}

    const nums = sel.map(arr => arr.join(',')).join(' ');

/* ========== 获取期号数据 ========== */
// 从服务器获取当前期号信息
async function fetchData() {
    try {
        // 添加时间戳防止缓存
        const res = await fetch('/qxc_data.json?t=' + Date.now());
        const d = await res.json();
        // 更新期号和截止时间
        document.getElementById('current-period').textContent = d.nextPeriod;
        document.getElementById('deadline').textContent = `截止：${d.nextDrawDay} ${d.nextDrawTime}`;
        document.getElementById('header-time').textContent = d.updateTime.split(' ')[1];
    } catch (e) { 
        console.error(e); 
    }
}

/* ========== 获取历史开奖数据 ========== */
async function fetchHistory() {
    try {
        const res = await fetch('/qxc_data.json?t=' + Date.now());
        const d = await res.json();
        if (d.history) {
            document.getElementById('history-loading').style.display = 'none';
            // 遍历历史数据，生成每期开奖号码
            document.getElementById('history-list').innerHTML = d.history.map(h => {
                // 前6个号码用紫色，第7个（特别号）用粉色
                const balls = h.numbers.map((n, i) => 
                    `<div class="history-ball ${i === 6 ? 'last' : 'normal'}">${n}</div>`
                ).join('');
                return `<div class="history-item">
                    <div class="history-header">
                        <span class="history-period">第${h.period}期</span>
                        <span class="history-date">${h.date}</span>
                    </div>
                    <div class="history-balls">${balls}</div>
                </div>`;
            }).join('');
        }
    } catch (e) { 
        document.getElementById('history-loading').textContent = '加载失败'; 
    }
}

/* ========== Toast提示消息 ========== */
// 显示短暂的提示信息
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    // 1.5秒后自动隐藏
    setTimeout(() => t.classList.remove('show'), 1500);
}
