<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩票选号助手</title>
    <style>
        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --bg-main: #f5f5f5;
            --bg-card: #ffffff;
            --border-light: #f0f0f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100vh; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; padding-bottom: 20px; }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px 16px;
            padding-top: calc(env(safe-area-inset-top) + 20px);
            color: #fff;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .header-subtitle {
            font-size: 13px;
            opacity: 0.85;
        }
        
        .container {
            padding: 12px;
        }
        
        .section {
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .section-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .lottery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .lottery-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .lottery-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .lottery-card:active {
            transform: translateY(0);
        }
        
        .lottery-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }
        
        .lottery-info {
            flex: 1;
            min-width: 0;
        }
        
        .lottery-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        
        .lottery-desc {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .lottery-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #fef3c7;
            color: #d97706;
            font-weight: 500;
            margin-top: 4px;
            display: inline-block;
        }
        
        .lottery-card.football .lottery-icon { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .lottery-card.basketball .lottery-icon { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .lottery-card.bjdc .lottery-icon { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .lottery-card.ctzc .lottery-icon { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .lottery-card.rx9 .lottery-icon { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); }
        .lottery-card.bqc .lottery-icon { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .lottery-card.zjq .lottery-icon { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .lottery-card.sggg .lottery-icon { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); }
        .lottery-card.dlt .lottery-icon { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .lottery-card.qxc .lottery-icon { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
        .lottery-card.pls .lottery-icon { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .lottery-card.plw .lottery-icon { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        
        .quick-entry {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }
        
        .quick-row {
            display: flex;
            gap: 8px;
        }
        
        .quick-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: var(--radius-sm);
            background: var(--bg-main);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .quick-btn:hover {
            background: #eee;
            color: var(--text-primary);
        }
        
        .quick-btn:active {
            transform: scale(0.98);
        }
        
        .update-time {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }
        
        @media (min-width: 640px) {
            .lottery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .container {
                max-width: 640px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">彩票选号助手</div>
        <div class="header-subtitle">数据实时更新，助力精准选号</div>
    </div>
    
    <div class="container">
        <div class="section">
            <div class="section-title">比分直播</div>
            <div class="lottery-grid">
                <div class="lottery-card football" onclick="goTo('live.html')" style="grid-column: span 2;">
                    <div class="lottery-icon">📺</div>
                    <div class="lottery-info">
                        <div class="lottery-name">比分直播</div>
                        <div class="lottery-desc" id="live-count">实时比分</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">竞彩游戏</div>
            <div class="lottery-grid">
                <div class="lottery-card football" onclick="goTo('football.html')">
                    <div class="lottery-icon">⚽</div>
                    <div class="lottery-info">
                        <div class="lottery-name">竞彩足球</div>
                        <div class="lottery-desc" id="football-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card basketball" onclick="goTo('basketball.html')">
                    <div class="lottery-icon">🏀</div>
                    <div class="lottery-info">
                        <div class="lottery-name">竞彩篮球</div>
                        <div class="lottery-desc" id="basketball-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card bjdc" onclick="goTo('bjdc.html')">
                    <div class="lottery-icon">⚡</div>
                    <div class="lottery-info">
                        <div class="lottery-name">北京单场</div>
                        <div class="lottery-desc" id="bjdc-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card sggg" onclick="goTo('sggg.html')">
                    <div class="lottery-icon">🎁</div>
                    <div class="lottery-info">
                        <div class="lottery-name">胜负过关</div>
                        <div class="lottery-desc" id="sggg-count">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">传统足彩</div>
            <div class="lottery-grid">
                <div class="lottery-card ctzc" onclick="goTo('ctzc.html')">
                    <div class="lottery-icon">🏆</div>
                    <div class="lottery-info">
                        <div class="lottery-name">胜负彩14场</div>
                        <div class="lottery-desc" id="ctzc-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card rx9" onclick="goTo('rx9.html')">
                    <div class="lottery-icon">9️⃣</div>
                    <div class="lottery-info">
                        <div class="lottery-name">任选9场</div>
                        <div class="lottery-desc" id="rx9-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card bqc" onclick="goTo('bqc6.html')">
                    <div class="lottery-icon">⏱️</div>
                    <div class="lottery-info">
                        <div class="lottery-name">6场半全场</div>
                        <div class="lottery-desc" id="bqc-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card zjq" onclick="goTo('zjq4.html')">
                    <div class="lottery-icon">⚽</div>
                    <div class="lottery-info">
                        <div class="lottery-name">4场总进球</div>
                        <div class="lottery-desc" id="zjq-count">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">数字彩票</div>
            <div class="lottery-grid">
                <div class="lottery-card dlt" onclick="goTo('dlt.html')">
                    <div class="lottery-icon">🎱</div>
                    <div class="lottery-info">
                        <div class="lottery-name">大乐透</div>
                        <div class="lottery-desc" id="dlt-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card qxc" onclick="goTo('qxc.html')">
                    <div class="lottery-icon">🎲</div>
                    <div class="lottery-info">
                        <div class="lottery-name">七星彩</div>
                        <div class="lottery-desc" id="qxc-count">加载中...</div>
                    </div>
                </div>
                <div class="lottery-card pls" onclick="goTo('pls.html')">
                    <div class="lottery-icon">7️⃣</div>
                    <div class="lottery-info">
                        <div class="lottery-name">排列三</div>
                        <div class="lottery-desc" id="pls-count">今日开奖</div>
                    </div>
                </div>
                <div class="lottery-card plw" onclick="goTo('plw.html')">
                    <div class="lottery-icon">5️⃣</div>
                    <div class="lottery-info">
                        <div class="lottery-name">排列五</div>
                        <div class="lottery-desc" id="plw-count">今日开奖</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="update-time" id="update-time"></div>
    </div>
    
    <script>
        function goTo(page) {
            window.location.href = page;
        }
        
        function getWeekdayText(weekday) {
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const today = new Date().getDay();
            return today === weekday ? '今日开奖' : weekdays[weekday] + '开奖';
        }
        
        function getDeadlineText(deadline) {
            if (!deadline) return '';
            // deadline格式: "03-26 22:00"
            const parts = deadline.split(' ');
            if (parts.length < 1) return '';
            const dateStr = parts[0]; // "03-26"
            const [month, day] = dateStr.split('-');
            const now = new Date();
            const year = now.getFullYear();
            const deadlineDate = new Date(year, parseInt(month) - 1, parseInt(day));
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const diffDays = Math.floor((deadlineDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return '今日停售';
            if (diffDays === 1) return '明日停售';
            
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return weekdays[deadlineDate.getDay()] + '停售';
        }
        
        function isSellingTime() {
            const now = new Date();
            const day = now.getDay() || 7;
            const hour = now.getHours();
            if (day === 0 || day === 6) {
                return hour >= 11 && hour < 23;
            } else {
                return hour >= 11 && hour < 22;
            }
        }
        
        function isBeforeSellingTime() {
            const hour = new Date().getHours();
            return hour < 11;
        }
        
        function isAfterSellingTime() {
            const now = new Date();
            const day = now.getDay() || 7;
            const hour = now.getHours();
            if (day === 0 || day === 6) {
                return hour >= 23;
            } else {
                return hour >= 22;
            }
        }
        
        async function loadCounts() {
            const dayMap = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
            const todayOfWeek = new Date().getDay() || 7;
            
            // 比分直播
            try {
                const liveRes = await fetch('data/live_data.json?t=' + Date.now());
                const liveData = await liveRes.json();
                const liveCount = liveData.live || 0;
                const totalCount = liveData.total || 0;
                if (liveCount > 0) {
                    document.getElementById('live-count').textContent = `${liveCount}场进行中`;
                } else if (totalCount > 0) {
                    document.getElementById('live-count').textContent = `今日${totalCount}场`;
                } else {
                    document.getElementById('live-count').textContent = '暂无赛事';
                }
            } catch(e) {
                document.getElementById('live-count').textContent = '实时比分';
            }
            
            // 竞彩足球 - 从API获取
            try {
                const footballRes = await fetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=1');
                const footballData = await footballRes.json();
                let footballCount = 0;
                let totalMatches = 0;
                
                if (footballData.value && footballData.value.matchInfoList) {
                    footballData.value.matchInfoList.forEach(day => {
                        if (day.subMatchList) {
                            totalMatches += day.subMatchList.length;
                            day.subMatchList.forEach(match => {
                                const matchNumStr = match.matchNumStr || '';
                                let matchDayOfWeek = 0;
                                for (const [day, num] of Object.entries(dayMap)) {
                                    if (matchNumStr.startsWith(day)) {
                                        matchDayOfWeek = num;
                                        break;
                                    }
                                }
                                
                                if (!matchDayOfWeek || matchDayOfWeek === 0) {
                                    footballCount++;
                                    return;
                                }
                                
                                let shouldShow = false;
                                if (isSellingTime()) {
                                    const tomorrow = todayOfWeek === 7 ? 1 : todayOfWeek + 1;
                                    shouldShow = matchDayOfWeek === todayOfWeek || matchDayOfWeek === tomorrow;
                                } else if (isBeforeSellingTime()) {
                                    shouldShow = matchDayOfWeek >= todayOfWeek;
                                } else {
                                    const tomorrow = todayOfWeek === 7 ? 1 : todayOfWeek + 1;
                                    shouldShow = matchDayOfWeek >= tomorrow;
                                }
                                
                                if (shouldShow) {
                                    footballCount++;
                                }
                            });
                        }
                    });
                }
                
                if (totalMatches === 0) {
                    document.getElementById('football-count').textContent = '暂无赛事';
                } else if (footballCount === 0) {
                    document.getElementById('football-count').textContent = '已停售';
                } else {
                    document.getElementById('football-count').textContent = `可选 ${footballCount} 场`;
                }
            } catch(e) {
                document.getElementById('football-count').textContent = '暂无赛事';
            }
            
            // 竞彩篮球
            try {
                const basketballRes = await fetch('data/basketball_matches.json?t=' + Date.now());
                const basketballData = await basketballRes.json();
                let basketballCount = 0;
                const totalMatches = basketballData.matches ? basketballData.matches.length : 0;
                
                if (basketballData.matches) {
                    basketballData.matches.forEach(m => {
                        const matchNumStr = m.matchNumStr || '';
                        let matchDayOfWeek = 0;
                        for (const [day, num] of Object.entries(dayMap)) {
                            if (matchNumStr.startsWith(day)) {
                                matchDayOfWeek = num;
                                break;
                            }
                        }
                        
                        if (!matchDayOfWeek || matchDayOfWeek === 0) {
                            basketballCount++;
                            return;
                        }
                        
                        let shouldShow = false;
                        if (isSellingTime()) {
                            const tomorrow = todayOfWeek === 7 ? 1 : todayOfWeek + 1;
                            shouldShow = matchDayOfWeek === todayOfWeek || matchDayOfWeek === tomorrow;
                        } else if (isBeforeSellingTime()) {
                            shouldShow = matchDayOfWeek >= todayOfWeek;
                        } else {
                            const tomorrow = todayOfWeek === 7 ? 1 : todayOfWeek + 1;
                            shouldShow = matchDayOfWeek >= tomorrow;
                        }
                        
                        if (shouldShow) {
                            basketballCount++;
                        }
                    });
                }
                
                if (totalMatches === 0) {
                    document.getElementById('basketball-count').textContent = '暂无赛事';
                } else if (basketballCount === 0) {
                    document.getElementById('basketball-count').textContent = '已停售';
                } else {
                    document.getElementById('basketball-count').textContent = `可选 ${basketballCount} 场`;
                }
            } catch(e) {
                document.getElementById('basketball-count').textContent = '暂无赛事';
            }
            
            // 北京单场
            try {
                const bjdcRes = await fetch('data/bjdc_data.json?t=' + Date.now());
                const bjdcData = await bjdcRes.json();
                const bjdcCount = bjdcData.matches ? bjdcData.matches.length : 0;
                document.getElementById('bjdc-count').textContent = `可选 ${bjdcCount} 场`;
            } catch(e) {
                document.getElementById('bjdc-count').textContent = '暂无场次';
            }
            
            // 胜负过关
            try {
                const sgggRes = await fetch('data/sggg_data.json?t=' + Date.now());
                const sgggData = await sgggRes.json();
                const sgggCount = sgggData.matches ? sgggData.matches.length : 0;
                document.getElementById('sggg-count').textContent = `可选 ${sgggCount} 场`;
            } catch(e) {
                document.getElementById('sggg-count').textContent = '暂无场次';
            }
            
            // 传统足彩14场
            try {
                const ctzcRes = await fetch('data/ctzc_data.json?t=' + Date.now());
                const ctzcData = await ctzcRes.json();
                const current = ctzcData.current || '';
                const periodData = ctzcData.periods ? ctzcData.periods[current] : null;
                const deadline = periodData ? periodData.deadline : '';
                const deadlineText = getDeadlineText(deadline);
                document.getElementById('ctzc-count').textContent = deadlineText || '暂无数据';
                // 任选9场使用相同的停售时间
                document.getElementById('rx9-count').textContent = deadlineText || '暂无数据';
            } catch(e) {
                document.getElementById('ctzc-count').textContent = '暂无数据';
                document.getElementById('rx9-count').textContent = '暂无数据';
            }
            
            // 6场半全场
            try {
                const bqcRes = await fetch('data/bqc6_data.json?t=' + Date.now());
                const bqcData = await bqcRes.json();
                const current = bqcData.current || '';
                const periodData = bqcData.periods ? bqcData.periods[current] : null;
                const deadline = periodData ? periodData.deadline : '';
                const deadlineText = getDeadlineText(deadline);
                document.getElementById('bqc-count').textContent = deadlineText || '暂无数据';
            } catch(e) {
                document.getElementById('bqc-count').textContent = '暂无数据';
            }
            
            // 4场总进球
            try {
                const zjqRes = await fetch('data/zjq4_data.json?t=' + Date.now());
                const zjqData = await zjqRes.json();
                const current = zjqData.current || '';
                const periodData = zjqData.periods ? zjqData.periods[current] : null;
                const deadline = periodData ? periodData.deadline : '';
                const deadlineText = getDeadlineText(deadline);
                document.getElementById('zjq-count').textContent = deadlineText || '暂无数据';
            } catch(e) {
                document.getElementById('zjq-count').textContent = '暂无数据';
            }
            
            // 大乐透 - 周一、三、六开奖
            try {
                const weekdays = [1, 3, 6]; // 周一、三、六
                const today = new Date().getDay();
                let nextDay = null;
                for (let i = 0; i <= 7; i++) {
                    const checkDay = (today + i) % 7;
                    if (weekdays.includes(checkDay)) {
                        nextDay = checkDay;
                        break;
                    }
                }
                document.getElementById('dlt-count').textContent = getWeekdayText(nextDay);
            } catch(e) {
                document.getElementById('dlt-count').textContent = '暂无数据';
            }
            
            // 七星彩 - 周二、五、日开奖
            try {
                const weekdays = [2, 5, 0]; // 周二、五、日
                const today = new Date().getDay();
                let nextDay = null;
                for (let i = 0; i <= 7; i++) {
                    const checkDay = (today + i) % 7;
                    if (weekdays.includes(checkDay)) {
                        nextDay = checkDay;
                        break;
                    }
                }
                document.getElementById('qxc-count').textContent = getWeekdayText(nextDay);
            } catch(e) {
                document.getElementById('qxc-count').textContent = '暂无数据';
            }
        }
        
        loadCounts();
        
        document.getElementById('update-time').textContent = '数据更新时间：' + new Date().toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    </script>
</body>
</html>
