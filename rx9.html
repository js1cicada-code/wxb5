<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任选9场</title>
    <style>
        /* ========== CSS变量定义 ========== */
        /* 使用CSS变量可以方便地统一管理颜色、间距等样式 */
        :root {
            --primary: #f59e0b;        /* 主色调：橙色 */
            --primary-dark: #d97706;   /* 主色调深色版本 */
            --primary-light: #fbbf24;  /* 主色调浅色版本 */
            --secondary: #fcd34d;      /* 次要色：金色 */
            --accent: #fbbf24;         /* 强调色：金色 */
            --success: #10b981;        /* 成功状态：绿色 */
            --danger: #ef4444;         /* 危险状态：红色 */
            --warning: #f59e0b;        /* 警告状态：橙色 */
            --bg-main: #f5f5f5;        /* 主背景色 */
            --bg-card: #ffffff;        /* 卡片背景色 */
            --bg-elevated: #fafafa;    /* 凸起元素背景色 */
            --text-primary: #1f2937;   /* 主要文字颜色 */
            --text-secondary: #6b7280; /* 次要文字颜色 */
            --text-muted: #9ca3af;     /* 弱化文字颜色 */
            --border-light: #f0f0f0;   /* 浅色边框 */
            --border-medium: #e5e7eb;  /* 中等边框颜色 */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);   /* 小阴影 */
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);   /* 中等阴影 */
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);  /* 大阴影 */
            --radius-sm: 4px;   /* 小圆角 */
            --radius-md: 8px;   /* 中等圆角 */
            --radius-lg: 12px;  /* 大圆角 */
            --transition-fast: 150ms ease;    /* 快速过渡动画 */
            --transition-normal: 200ms ease;  /* 普通过渡动画 */
            --transition-slow: 300ms ease;    /* 慢速过渡动画 */
        }
        
        /* ========== 基础样式重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; min-height: 100vh; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        
        /* ========== 顶部导航栏样式 ========== */
        /* 使用渐变色作为背景，固定在页面顶部 */
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 0 12px; height: 54px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
        
        /* 返回按钮：使用CSS伪元素画一个箭头 */
        .header-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .header-content { flex: 1; text-align: center; }
        .header h1 { color: #fff; font-size: 17px; font-weight: 600; line-height: 1.2; }
        .header-time { color: rgba(255,255,255,0.85); font-size: 11px; margin-top: 2px; }
        
        /* 标题区域居中显示 */
        .header-content { flex: 1; text-align: center; }
        
        /* 彩种选择器：点击可展开下拉菜单 */
        
        
        /* ========== 期号信息栏 ========== */
        /* 显示当前期号和截止时间 */
        .period-bar { background: var(--bg-card); padding: 10px 12px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); gap: 16px; }
        .period-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .period-label span { color: var(--primary); font-weight: 700; }
        .deadline { font-size: 12px; color: var(--danger); font-weight: 500; }
        
        /* ========== 比赛列表区域 ========== */
        /* 比赛卡片容器 */
        .match-section { background: var(--bg-card); margin-bottom: 10px; border-radius: var(--radius-md); margin: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
        
        /* 单场比赛项 */
        .match-item { padding: 10px 12px; border-bottom: 1px solid var(--border-light); transition: background var(--transition-fast); }
        .match-item:last-child { border-bottom: none; }
        .match-item:active { background: var(--bg-elevated); }
        .match-item.has-selection { background: linear-gradient(135deg, rgba(245, 158, 11, 0.03) 0%, rgba(245, 158, 11, 0.01) 100%); } /* 已选择的比赛高亮 */
        
        /* 比赛基本信息：场次号、联赛、时间、状态 */
        .match-info { display: flex; align-items: center; margin-bottom: 6px; }
        .match-num { padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .match-league { font-size: 11px; color: var(--primary); font-weight: 600; margin-right: 6px; }
        .match-time { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
        .match-status { font-size: 9px; color: var(--success); background: #ecfdf5; padding: 2px 6px; border-radius: var(--radius-sm); font-weight: 500; }
        
        /* 球队信息展示 */
        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .team { flex: 1; text-align: center; }
        .team.home { text-align: right; padding-right: 10px; }  /* 主队靠右 */
        .team.away { text-align: left; padding-left: 10px; }    /* 客队靠左 */
        .team-name { font-size: 13px; color: var(--text-primary); font-weight: 600; }
        .team-rank { font-size: 10px; color: var(--text-muted); margin-top: 2px; }  /* 球队排名 */
        .vs { font-size: 11px; color: var(--text-muted); padding: 0 8px; font-weight: 500; }
        
        /* 赔率选择区域：胜、平、负三个选项 */
        .odds-row { display: flex; gap: 8px; }
        .odds-item { flex: 1; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); padding: 8px 4px; text-align: center; cursor: pointer; transition: all var(--transition-normal); position: relative; overflow: hidden; }
        .odds-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .odds-item:active { transform: translateY(0) scale(0.98); }
        .odds-item.selected { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15); }  /* 选中状态 */
        .odds-item.disabled { background: var(--bg-main); cursor: not-allowed; opacity: 0.6; }  /* 禁用状态 */
        .odds-item .label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .odds-item .value { font-size: 16px; color: var(--text-primary); font-weight: 700; margin-top: 2px; }
        
        /* ========== 底部投注栏 ========== */
        /* 固定在页面底部，用户选择比赛后显示 */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); padding: 12px 12px; display: none; transform: translateY(100%); transition: transform var(--transition-slow); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .bottom-bar.show { display: block; transform: translateY(0); }
        
        /* 投注信息区 */
        .bet-info { display: flex; align-items: center; justify-content: space-between; }
        .bet-stats { display: flex; flex-direction: column; gap: 2px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .bet-tip { font-size: 11px; color: var(--text-muted); }
        
        /* 清空按钮 */
        .clear-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 8px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); display: flex; align-items: center; gap: 4px; transition: all var(--transition-fast); font-weight: 500; }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
        
        /* 投注额外信息区：选择足够场次后显示 */
        .bet-extra { display: none; padding-top: 12px; border-top: 1px solid var(--border-light); margin-top: 12px; }
        .bet-extra.show { display: block; }
        
        /* 投注信息顶部 */
        .bet-extra-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .bet-extra-title { font-size: 14px; color: var(--text-primary); font-weight: 600; }
        .bonus { font-size: 13px; color: var(--text-secondary); }
        .bonus span { color: var(--primary); font-weight: 700; }
        
        /* 投注金额汇总 */
        .bet-summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
        .bet-summary-item .label { color: var(--text-secondary); }
        .bet-summary-item span:not(.label) { color: var(--primary); font-weight: 700; }
        
        /* 倍数选择区 */
        .times-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .times-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .times-control { display: flex; align-items: center; gap: 10px; }
        .times-btn { width: 32px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--text-secondary); font-weight: 600; line-height: 30px; text-align: center; transition: all var(--transition-fast); }
        .times-btn:hover { border-color: var(--primary); color: var(--primary); }
        .times-input { width: 56px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-primary); background: var(--bg-card); transition: border-color var(--transition-fast); }
        .times-input:focus { border-color: var(--primary); outline: none; }
        
        /* 确认投注按钮 */
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3); }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        
        /* 比赛列表容器：底部留出足够空间给投注栏 */
        .match-list { padding-bottom: 120px; }
        
        .toast-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; animation: fadeInOut 2s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        
        @media (min-width: 768px) {
            body { background: linear-gradient(135deg, #f0f0f0 0%, #e5e5e5 100%); min-height: 100vh; }
            .header { max-width: 1200px; margin: 16px auto 0; border-radius: var(--radius-lg); }
            .period-bar { max-width: 1200px; margin: 0 auto; border-radius: var(--radius-md); }
            .match-list { max-width: 1200px; margin: 0 auto; padding: 16px 16px 140px; }
            .match-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; margin: 0; background: transparent; }
            .match-item { border-radius: var(--radius-md); cursor: pointer; }
            .match-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
            .bottom-bar { max-width: 1200px; margin: 0 auto 16px; border-radius: var(--radius-lg); }
            .modal.show { align-items: center; justify-content: center; }
            .modal-content { max-width: 500px; border-radius: var(--radius-lg); }
        }
        @media (min-width: 1024px) { .match-section { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); } }
    </style>
</head>
<body>
<!-- ========== 顶部导航栏 ========== -->
<div class="header">
    <div class="header-back" onclick="window.location.href='index.html'"></div>
    <div class="header-content">
        <h1>任选9场</h1>
        <div class="header-time" id="header-time"></div>
    </div>
</div>

<!-- ========== 期号信息栏 ==========信息栏 ========== -->
<!-- 显示当前期号和截止时间 -->
<div class="period-bar">
    <div class="period-label">期号：<span id="current-period">----期</span></div>
    <div class="deadline" id="deadline">截止时间：--:--</div>
</div>

<!-- ========== 多期次选择栏 ========== -->
<!-- 当有多个期次在售时显示 -->
<div class="multi-period-bar" id="multi-period-bar" style="display:none; background:#fffbe6; padding:8px 12px; border-bottom:1px solid #ffe58f;">
    <div style="font-size:12px; color:#d48806; font-weight:500;">多期在售</div>
    <div id="period-list" style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;"></div>
</div>

<!-- ========== 比赛列表区域 ========== -->
<!-- 由JavaScript动态渲染比赛数据 -->
<div id="match-list" class="match-list"></div>

<!-- ========== 加载遮罩层 ========== -->
<!-- 数据加载时显示的loading状态 -->
<div id="loading-overlay" style="display:none; position:fixed; top:54px; left:0; right:0; bottom:0; background:rgba(255,255,255,0.9); z-index:50; opacity:0; transition:opacity 0.3s ease;">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
        <div class="spinner" style="width:40px; height:40px; border:3px solid #e5e7eb; border-top-color:#f59e0b; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <div style="margin-top:12px; color:#6b7280; font-size:14px;">正在加载期次数据...</div>
    </div>
</div>

<!-- 加载动画样式 -->
<style>
@keyframes spin { to { transform: rotate(360deg); } }
#match-list { transition: opacity 0.3s ease; }
#match-list.fade-out { opacity: 0.3; }
#match-list.fade-in { opacity: 1; }
</style>

<!-- ========== 底部投注栏 ========== -->
<!-- 用户选择比赛后显示，包含投注信息和确认按钮 -->
<div class="bottom-bar">
    <div class="bet-info">
        <div class="bet-stats">
            <div class="bet-amount">已选 <span id="match-count">0</span>/9+ 场</div>
            <div class="bet-tip" id="bet-tip">至少选择9场</div>
        </div>
        <button class="clear-btn" id="clear-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            清空
        </button>
    </div>
    <!-- 投注额外信息：选择足够场次后显示 -->
    <div class="bet-extra" id="bet-extra">
        <div class="bet-extra-top">
            <div class="bet-extra-title">投注信息</div>
            <div class="bonus">预计奖金：<span id="bonus-amount">0.00</span> 元</div>
        </div>
        <div class="bet-summary">
            <div class="bet-summary-item"><span class="label">投注注数：</span><span id="bet-count">0</span> 注</div>
            <div class="bet-summary-item"><span class="label">投注金额：</span><span id="bet-money">0</span> 元</div>
        </div>
        <div class="times-row">
            <div class="times-label">投注倍数</div>
            <div class="times-control">
                <button class="times-btn" id="times-minus">-</button>
                <input type="number" class="times-input" id="times-input" value="1" min="1" max="99">
                <button class="times-btn" id="times-plus">+</button>
            </div>
        </div>
        <button class="submit-btn" id="submit-btn" disabled>确认选号</button>
    </div>
</div>

<script>
/* ========== 常量定义 ========== */
// 任选9场规则：最少选择9场比赛，最多选择14场，每注2元
const matchData = [];           // 比赛数据数组，存储从服务器获取的所有比赛信息
const matchDataMap = new Map(); // 比赛数据映射表，通过比赛ID快速查找比赛信息
const selections = {};          // 用户选择记录，key为比赛ID，value为选中的结果数组（如['3','1']表示选了胜和平）
const domCache = new Map();     // DOM元素缓存，避免重复查询DOM提高性能

/* ========== 变量定义 ========== */
let times = 1;                  // 投注倍数，默认1倍
let updateInterval = null;      // 定时更新数据的定时器引用
let currentExpect = null;       // 当前显示的期次号
let periodsData = [];           // 多期次数据数组

/* ========== 游戏规则常量 ========== */
const MIN_MATCHES = 9;          // 最少选择场次：9场
const MAX_MATCHES = 14;         // 最多选择场次：14场
const PRIZE_POOL = 2000000;     // 奖池金额（示例值）

/* ========== DOM元素缓存获取函数 ========== */
/**
 * 获取缓存的DOM元素
 * @param {string} id - 元素ID
 * @returns {HTMLElement} DOM元素
 * @description 使用Map缓存已查询的DOM元素，避免重复查询提高性能
 */
function getCachedElement(id) {
    if (!domCache.has(id)) {
        domCache.set(id, document.getElementById(id));
    }
    return domCache.get(id);
}

/* ========== 获取比赛数据函数 ========== */
/**
 * 通过比赛ID获取比赛信息
 * @param {string|number} id - 比赛ID
 * @returns {Object|undefined} 比赛数据对象，未找到返回undefined
 */
function getMatch(id) {
    return matchDataMap.get(String(id));
}

/* ========== 下拉菜单切换函数 ========== */
/**
 * 切换彩种选择下拉菜单的显示/隐藏状态
 */
function updateTime() {
        const now = new Date();
        document.getElementById('header-time').textContent = now.toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }) + ' 更新';
    }

/* ========== 加载状态显示函数 ========== */
/**
 * 显示加载遮罩层
 * @description 切换期次时显示loading状态，提升用户体验
 */
function showLoading() {
    const overlay = getCachedElement('loading-overlay');
    const matchList = getCachedElement('match-list');
    matchList.classList.add('fade-out');
    overlay.style.display = 'block';
    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
}

/* ========== 加载状态隐藏函数 ========== */
/**
 * 隐藏加载遮罩层
 * @description 数据加载完成后隐藏loading状态
 */
function hideLoading() {
    const overlay = getCachedElement('loading-overlay');
    const matchList = getCachedElement('match-list');
    overlay.style.opacity = '0';
    matchList.classList.remove('fade-out');
    matchList.classList.add('fade-in');
    setTimeout(() => { 
        overlay.style.display = 'none';
        matchList.classList.remove('fade-in');
    }, 300);
}

/* ========== 期次切换函数 ========== */
/**
 * 切换到指定期次
 * @param {string} expect - 期次号
 * @description 从本地缓存数据中获取指定期次的比赛数据并渲染
 */
function switchPeriod(expect) {
    // 如果点击的是当前期次，不做处理
    if (expect === currentExpect) return;
    currentExpect = expect;
    
    // 从本地缓存数据获取指定期次
    if (allPeriodsData && allPeriodsData.periods && allPeriodsData.periods[expect]) {
        const periodData = allPeriodsData.periods[expect];
        // 清空当前比赛数据
        matchData.length = 0;
        matchDataMap.clear();
        
        // 填充新期次的比赛数据
        periodData.matches.forEach((m, index) => {
            // 确保每场比赛有唯一ID
            if (!m.id) m.id = m.matchNum || (index + 1).toString();
            matchData.push(m);
            matchDataMap.set(String(m.id), m);
            // 初始化该比赛的选择数组
            if (!selections[m.id]) selections[m.id] = [];
        });
        
        // 更新期号和截止时间显示
        getCachedElement('current-period').textContent = periodData.period + '期';
        if (periodData.deadline) getCachedElement('deadline').textContent = '截止时间：' + periodData.deadline;
        
        // 清空之前的选择
        Object.keys(selections).forEach(key => { selections[key] = []; });
        
        // 重新渲染比赛列表和底部栏
        renderMatches();
        updateBottomBar();
        renderPeriodTabs();
    }
}

/* ========== 期次标签渲染函数 ========== */
/**
 * 渲染多期次选择标签
 * @description 当有多个期次在售时，生成期次切换标签
 */
function renderPeriodTabs() {
    const periodList = getCachedElement('period-list');
    // 只有单期时不显示多期选择栏
    if (!allPeriodsData || !allPeriodsData.periods_list || allPeriodsData.periods_list.length <= 1) return;
    
    // 生成期次标签HTML
    periodList.innerHTML = allPeriodsData.periods_list.map(p => {
        const isActive = p.period === currentExpect;
        return '<span onclick="switchPeriod(\'' + p.period + '\')" style="background:' + (isActive ? '#f59e0b' : '#fff') + ';padding:4px 10px;border-radius:4px;font-size:12px;color:' + (isActive ? '#fff' : '#333') + ';border:1px solid ' + (isActive ? '#f59e0b' : '#d9d9d9') + ';cursor:pointer;transition:all 0.2s ease;">' + (p.label || p.period) + '</span>';
    }).join('');
}

/* ========== 全局期次数据 ========== */
let allPeriodsData = null;  // 存储所有期次的数据，用于期次切换

/* ========== 获取比赛数据函数 ========== */
/**
 * 从服务器获取比赛数据
 * @param {string} expect - 可选，指定期次号
 * @returns {Promise<boolean>} 是否获取成功
 * @description 从服务器获取比赛数据，支持多期次数据格式
 */
async function fetchMatchData(expect = null) {
    try {
        // 添加时间戳防止浏览器缓存
        const url = '/ctzc_data.json?t=' + Date.now();
        const response = await fetch(url);
        if (!response.ok) throw new Error('数据获取失败');
        const data = await response.json();
        
        // 保存全部期次数据
        allPeriodsData = data;
        
        // 确定要显示的期次（兼容新旧格式）
        let targetPeriod = expect || data.current || data.period;
        let periodData = null;
        
        // 新格式：data.periods 是对象
        if (data.periods && typeof data.periods === 'object' && !Array.isArray(data.periods) && data.periods[targetPeriod]) {
            periodData = data.periods[targetPeriod];
        }
        
        // 兼容旧格式：data.periods 是数组
        if (!periodData && data.periods && Array.isArray(data.periods) && data.periods.length > 0) {
            periodsData = data.periods;
        }
        
        // 兼容旧格式：直接有 matches
        if (!periodData && data.matches) {
            periodData = data;
        }
        
        // 如果获取到有效的比赛数据
        if (periodData && periodData.matches && periodData.matches.length > 0) {
            // 清空并重新填充比赛数据
            matchData.length = 0;
            matchDataMap.clear();
            periodData.matches.forEach((m, index) => {
                // 确保每场比赛有唯一ID
                if (!m.id) m.id = m.matchNum || (index + 1).toString();
                matchData.push(m);
                matchDataMap.set(String(m.id), m);
                // 初始化该比赛的选择数组
                if (!selections[m.id]) selections[m.id] = [];
            });
            
            // 更新当前期次
            currentExpect = targetPeriod;
            getCachedElement('current-period').textContent = targetPeriod + '期';
            if (periodData.deadline) getCachedElement('deadline').textContent = '截止时间：' + periodData.deadline;
            
            // 处理多期次显示
            const multiPeriodBar = getCachedElement('multi-period-bar');
            if (data.periods_list && data.periods_list.length > 1) {
                allPeriodsData = data;
                multiPeriodBar.style.display = 'block';
                renderPeriodTabs();
            } else if (periodsData && periodsData.length > 1) {
                allPeriodsData = { periods_list: periodsData, periods: {} };
                multiPeriodBar.style.display = 'block';
                renderPeriodTabs();
            } else {
                multiPeriodBar.style.display = 'none';
            }
            
            // 清空之前的选择状态
            Object.keys(selections).forEach(key => { selections[key] = []; });
            
            // 渲染比赛列表
            renderMatches();
            updateBottomBar();
            getCachedElement('header-time').textContent = data.updateTime || new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
            return true;
        }
        throw new Error('无比赛数据');
    } catch (error) {
        // 获取失败时使用模拟数据
        console.error('获取数据失败:', error);
        loadMockData();
        renderMatches();
        getCachedElement('header-time').textContent = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
        return false;
    }
}

/* ========== 加载模拟数据函数 ========== */
/**
 * 加载模拟比赛数据
 * @description 当无法从服务器获取数据时，使用模拟数据确保页面可用
 */
function loadMockData() {
    matchData.length = 0;
    matchDataMap.clear();
    
    // 模拟数据：联赛和球队列表
    const leagues = ['英超', '西甲', '德甲', '意甲', '法甲', '荷甲', '葡超', '苏超'];
    const teams = ['曼联', '利物浦', '切尔西', '阿森纳', '热刺', '曼城', '皇马', '巴萨', '马竞', '拜仁', '多特', '尤文', '国米', 'AC米兰', '巴黎', '里昂'];
    
    // 生成当前日期作为期号
    const now = new Date();
    const periodStr = now.getFullYear().toString() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
    
    // 生成14场模拟比赛
    for (let i = 0; i < 14; i++) {
        const m = {
            id: i + 1,
            matchNum: (i + 1).toString(),
            league: leagues[i % leagues.length],
            time: String(20 + Math.floor(i / 4)).padStart(2, '0') + ':' + String((i * 15) % 60).padStart(2, '0'),
            home: teams[i % teams.length],
            away: teams[(i + 5) % teams.length],
            homeRank: (i % 10) + 1,
            awayRank: ((i + 3) % 10) + 1,
            odds3: (1.5 + (i % 5) * 0.5).toFixed(2),  // 主胜赔率
            odds1: (2.5 + (i % 4) * 0.3).toFixed(2),  // 平局赔率
            odds0: (3.0 + (i % 6) * 0.4).toFixed(2)   // 客胜赔率
        };
        matchData.push(m);
        matchDataMap.set(String(m.id), m);
        if (!selections[m.id]) selections[m.id] = [];
    }
    
    // 更新期号显示
    getCachedElement('current-period').textContent = periodStr + '期';
    getCachedElement('deadline').textContent = '截止时间：22:00';
    
    // 显示多期次选择栏（模拟）
    const multiPeriodBar = getCachedElement('multi-period-bar');
    const periodList = getCachedElement('period-list');
    multiPeriodBar.style.display = 'block';
    periodList.innerHTML = '<span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:12px;color:#333;border:1px solid #d9d9d9;">' + periodStr + '期</span>' +
        '<span style="background:#fff;padding:4px 10px;border-radius:4px;font-size:12px;color:#333;border:1px solid #d9d9d9;">' + (parseInt(periodStr) + 1) + '期</span>';
}

/* ========== 赔率格式化函数 ========== */
/**
 * 格式化赔率显示
 * @param {string|number} value - 赔率值
 * @returns {string} 格式化后的赔率字符串，无效值返回'--'
 */
function formatOdd(value) {
    if (value === null || value === undefined || value === '' || isNaN(parseFloat(value))) {
        return '--';
    }
    return parseFloat(value).toFixed(2);
}

/* ========== 比赛列表渲染函数 ========== */
/**
 * 渲染所有比赛列表
 * @description 遍历比赛数据，生成比赛列表HTML并插入页面
 */
function renderMatches() {
    const container = document.getElementById('match-list');
    if (matchData.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
        return;
    }
    let html = '<div class="match-section">';
    matchData.forEach(m => { html += renderMatchItem(m); });
    html += '</div>';
    container.innerHTML = html;
}

/* ========== 单场比赛渲染函数 ========== */
/**
 * 渲染单场比赛的HTML
 * @param {Object} m - 比赛数据对象
 * @returns {string} 比赛项的HTML字符串
 * @description 包含比赛信息（场次、联赛、时间）、球队信息、赔率选项
 */
function renderMatchItem(m) {
    const matchIdStr = String(m.id);
    // 确保该比赛有选择数组
    if (!selections[matchIdStr]) selections[matchIdStr] = [];
    const sel = selections[matchIdStr];
    const hasSelection = sel.length > 0;
    
    return `
            <div class="match-item ${hasSelection ? 'has-selection' : ''}">
                <div class="match-info">
                    <span class="match-num">${m.matchNum}</span>
                    <span class="match-league">${m.league}</span>
                    <span class="match-time">${m.time}</span>
                    <span class="match-status">销售中</span>
                </div>
                <div class="teams">
                    <div class="team home">
                        <div class="team-name">${m.home}</div>
                        ${m.homeRank ? '<div class="team-rank">[' + m.homeRank + ']</div>' : ''}
                    </div>
                    <div class="vs">VS</div>
                    <div class="team away">
                        <div class="team-name">${m.away}</div>
                        ${m.awayRank ? '<div class="team-rank">[' + m.awayRank + ']</div>' : ''}
                    </div>
                </div>
                <div class="odds-row">
                    <div class="odds-item ${sel.includes('3') ? 'selected' : ''}" onclick="toggleOdds(${m.id}, '3')">
                        <div class="label">胜(3)</div>
                        <div class="value">${formatOdd(m.odds3)}</div>
                    </div>
                    <div class="odds-item ${sel.includes('1') ? 'selected' : ''}" onclick="toggleOdds(${m.id}, '1')">
                        <div class="label">平(1)</div>
                        <div class="value">${formatOdd(m.odds1)}</div>
                    </div>
                    <div class="odds-item ${sel.includes('0') ? 'selected' : ''}" onclick="toggleOdds(${m.id}, '0')">
                        <div class="label">负(0)</div>
                        <div class="value">${formatOdd(m.odds0)}</div>
                    </div>
                </div>
            </div>`;
}

/* ========== 赔率选择切换函数 ========== */
/**
 * 切换某场比赛的某个结果选项
 * @param {string|number} matchId - 比赛ID
 * @param {string} selection - 选择结果：'3'主胜、'1'平局、'0'客胜
 * @description 点击赔率选项时切换选中/未选中状态
 */
function toggleOdds(matchId, selection) {
    const matchIdStr = String(matchId);
    // 确保该比赛有选择数组
    if (!selections[matchIdStr]) selections[matchIdStr] = [];
    
    const sel = selections[matchIdStr];
    const idx = sel.indexOf(selection);
    
    if (idx > -1) {
        // 已选中则取消选择
        sel.splice(idx, 1);
    } else {
        // 未选中则添加选择
        sel.push(selection);
    }
    
    // 重新渲染比赛列表和底部栏
    renderMatches();
    updateBottomBar();
}

/* ========== 获取已选场次数量函数 ========== */
/**
 * 统计已选择的比赛场次数量
 * @returns {number} 已选择的场次数量
 */
function getSelectedMatchCount() {
    let count = 0;
    for (const id in selections) {
        if (selections[id].length > 0) count++;
    }
    return count;
}

/* ========== 更新底部投注栏函数 ========== */
/**
 * 更新底部投注栏的显示状态
 * @description 根据已选场次数量更新投注信息、金额等
 */
function updateBottomBar() {
    const matchCount = getSelectedMatchCount();
    const betExtra = getCachedElement('bet-extra');
    const bottomBar = document.querySelector('.bottom-bar');
    const submitBtn = getCachedElement('submit-btn');
    const betTip = getCachedElement('bet-tip');
    const matchCountEl = getCachedElement('match-count');
    
    if (matchCount > 0) {
        // 有选择时显示底部栏
        bottomBar.style.display = 'block';
        setTimeout(() => bottomBar.classList.add('show'), 10);
        matchCountEl.textContent = matchCount;
        
        if (matchCount < MIN_MATCHES) {
            // 未达到最少场次
            betExtra.classList.remove('show');
            betTip.textContent = '还需选择' + (MIN_MATCHES - matchCount) + '场';
            betTip.style.color = 'var(--warning)';
            submitBtn.disabled = true;
        } else {
            // 达到最少场次，显示详细投注信息
            betExtra.classList.add('show');
            betTip.textContent = '已选' + matchCount + '场（最多14场）';
            betTip.style.color = 'var(--success)';
            submitBtn.disabled = false;
            
            // 计算注数和金额
            const totalBets = calculateBets();
            getCachedElement('bet-count').textContent = totalBets;
            getCachedElement('bet-money').textContent = (totalBets * 2 * times).toFixed(0);
            getCachedElement('bonus-amount').textContent = PRIZE_POOL.toFixed(2);
        }
    } else {
        // 无选择时隐藏底部栏
        bottomBar.classList.remove('show');
        setTimeout(() => {
            if (!bottomBar.classList.contains('show')) bottomBar.style.display = 'none';
        }, 300);
        betExtra.classList.remove('show');
    }
}

/* ========== 计算投注注数函数 ========== */
/**
 * 计算当前选择的投注注数
 * @returns {number} 投注注数，未达到最少场次返回0
 * @description 采用复式投注计算方式：各场次选择数相乘
 */
function calculateBets() {
    let total = 1;
    let selectedCount = 0;
    for (const id in selections) {
        if (selections[id].length > 0) {
            total *= selections[id].length;  // 复式：各场次选择数相乘
            selectedCount++;
        }
    }
    // 只有达到最少场次才返回有效注数
    return selectedCount >= MIN_MATCHES ? total : 0;
}

/* ========== 确认投注函数 ========== */
/**
 * 提交投注
 * @description 弹出确认对话框，用户确认后显示投注成功提示
 */
function submitBet() {
    const matchCount = getSelectedMatchCount();
    // 未达到最少场次不允许投注
    if (matchCount < MIN_MATCHES) return;
    
    // 计算投注信息
    const totalBets = calculateBets();
    const totalMoney = totalBets * 2 * times;
    
    // 构建确认信息
    let confirmMsg = '投注确认\n\n';
    confirmMsg += '任选9场\n';
    confirmMsg += '已选场次：' + matchCount + ' 场\n';
    confirmMsg += '投注注数：' + totalBets + ' 注\n';
    confirmMsg += '投注倍数：' + times + ' 倍\n';
    confirmMsg += '投注金额：' + totalMoney + ' 元\n\n';
    confirmMsg += '是否确认投注？';
    
    if (confirm(confirmMsg)) {
        alert('投注成功！\n\n共 ' + totalBets + ' 注，' + totalMoney + ' 元');
        // 投注成功后清空选择
        for (const id in selections) selections[id] = [];
        times = 1;
        document.getElementById('times-input').value = 1;
        renderMatches();
        updateBottomBar();
    }
}

/* ========== 页面初始化函数 ========== */
/**
 * 页面加载完成后执行初始化
 * @description 获取比赛数据并设置定时刷新
 */
async function init() { updateTime();
    updateTime();
await fetchMatchData();
    // 每2分钟自动刷新数据
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(fetchMatchData, 120000);
}

/* ========== 执行初始化 ========== */
init();

/* ========== 倍数减少按钮事件 ========== */
document.getElementById('times-minus').addEventListener('click', () => {
    if (times > 1) {
        times--;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

/* ========== 倍数增加按钮事件 ========== */
document.getElementById('times-plus').addEventListener('click', () => {
    if (times < 99) {
        times++;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

/* ========== 倍数输入框变化事件 ========== */
document.getElementById('times-input').addEventListener('change', (e) => {
    let val = parseInt(e.target.value) || 1;
    // 限制倍数范围在1-99之间
    if (val < 1) val = 1;
    if (val > 99) val = 99;
    times = val;
    e.target.value = times;
    updateBottomBar();
});

/* ========== 清空按钮事件 ========== */
document.getElementById('clear-btn').addEventListener('click', () => {
    // 清空所有选择
    for (const id in selections) selections[id] = [];
    times = 1;
    document.getElementById('times-input').value = 1;
    renderMatches();
    updateBottomBar();
});

/* ========== 确认投注按钮事件 ========== */
document.getElementById('submit-btn').addEventListener('click', submitBet);
</script>
</body>
</html>
