const matchData = [];           // 比赛数据数组，存储所有比赛信息
const matchDataMap = new Map(); // 比赛数据映射表，通过ID快速查找比赛
const selections = {};          // 用户选择对象，key为比赛ID，value为选中的进球数数组
const domCache = new Map();     // DOM元素缓存，减少重复查询DOM
let times = 1;                  // 投注倍数，默认1倍
let updateInterval = null;      // 定时更新数据的interval ID
let currentExpect = null;       // 当前期号
let periodsData = [];           // 多期数据数组
const MAX_MATCHES = 4;          // 最大比赛场数，4场总进球必须选4场
const PRIZE_POOL = 2000000;     // 奖池金额，用于显示预计奖金

// 总进球选项：0球、1球、2球、3球、4球、5球、6球、7球及以上
const zjqOptions = ['0', '1', '2', '3', '4', '5', '6', '7+'];

/* ========== DOM元素缓存工具函数 ========== */
/**
 * 获取缓存的DOM元素
 * 避免重复调用getElementById，提升性能
 * @param {string} id - 元素ID
 * @returns {HTMLElement} DOM元素
 */
function getCachedElement(id) {
    if (!domCache.has(id)) {
        domCache.set(id, document.getElementById(id));
    }
    return domCache.get(id);
}

/* ========== 获取比赛数据 ========== */
/**
 * 通过比赛ID获取比赛数据
 * @param {string|number} id - 比赛ID
 * @returns {Object|undefined} 比赛数据对象，未找到返回undefined
 */
function getMatch(id) {
    return matchDataMap.get(String(id));
}

/* ========== 下拉菜单控制 ========== */
/**
 * 切换下拉菜单的显示/隐藏状态
 */
function updateTime() {
        const now = new Date();
        document.getElementById('header-time').textContent = now.toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }) + ' 更新';
    }

/* ========== 加载状态控制 ========== */
/**
 * 显示加载遮罩层
 * 在切换期次或加载数据时显示
 */
function showLoading() {
    const overlay = getCachedElement('loading-overlay');
    const matchList = getCachedElement('match-list');
    matchList.classList.add('fade-out');      // 比赛列表淡出
    overlay.style.display = 'block';
    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
}

/**
 * 隐藏加载遮罩层
 * 数据加载完成后调用
 */
function hideLoading() {
    const overlay = getCachedElement('loading-overlay');
    const matchList = getCachedElement('match-list');
    overlay.style.opacity = '0';
    matchList.classList.remove('fade-out');
    matchList.classList.add('fade-in');       // 比赛列表淡入
    setTimeout(() => { 
        overlay.style.display = 'none';
        matchList.classList.remove('fade-in');
    }, 300);
}

/* ========== 期次切换 ========== */
/**
 * 检查期次是否已过期
 */
function isPeriodExpired(deadline) {
    if (!deadline) return true;
    const parts = deadline.split(' ');
    if (parts.length < 2) return true;
    const [month, day] = parts[0].split('-');
    const [hour, minute] = parts[1].split(':');
    const now = new Date();
    const deadlineDate = new Date(now.getFullYear(), parseInt(month) - 1, parseInt(day), parseInt(hour), parseInt(minute));
    return now > deadlineDate;
}

/**
 * 找到第一个未过期的期次
 */
function findActivePeriod(periodsList, periods) {
    if (!periodsList || !periods) return null;
    for (const p of periodsList) {
        const pData = periods[p.period];
        if (pData && !isPeriodExpired(pData.deadline)) {
            return p.period;
        }
    }
    return null;
}

/**
 * 切换到指定期次
 * @param {string} expect - 期号
 */
function switchPeriod(expect) {
    // 如果是当前期次，不执行切换
    if (expect === currentExpect) return;
    currentExpect = expect;
    
    // 从本地缓存数据获取指定期次的数据
    if (allPeriodsData && allPeriodsData.periods && allPeriodsData.periods[expect]) {
        const periodData = allPeriodsData.periods[expect];
        
        // 清空当前比赛数据
        matchData.length = 0;
        matchDataMap.clear();
        
        // 填充新的比赛数据
        periodData.matches.forEach((m, index) => {
            if (!m.id) m.id = m.matchNum || (index + 1).toString();  // 确保有ID
            matchData.push(m);
            matchDataMap.set(String(m.id), m);
            if (!selections[m.id]) selections[m.id] = [];  // 初始化选择数组
        });
        
        // 更新期号和截止时间显示
        getCachedElement('current-period').textContent = periodData.period + '期';
        if (periodData.deadline) getCachedElement('deadline').textContent = '截止时间：' + periodData.deadline;
        
        // 清空所有选择
        Object.keys(selections).forEach(key => { selections[key] = []; });
        
        // 重新渲染界面
        renderMatches();
        updateBottomBar();
        renderPeriodTabs();
    }
}

/* ========== 渲染期次选择标签 ========== */
/**
 * 渲染多期选择的标签页
 * 当有多个期次在售时显示
 */
function renderPeriodTabs() {
    const periodList = getCachedElement('period-list');
    if (!allPeriodsData || !allPeriodsData.periods_list) return;
    
    // 只显示未过期的期次
    const activePeriods = allPeriodsData.periods_list.filter(p => {
        const pData = allPeriodsData.periods[p.period];
        return pData && !isPeriodExpired(pData.deadline);
    });
    
    if (activePeriods.length <= 1) return;
    
    periodList.innerHTML = activePeriods.map(p => {
        const isActive = p.period === currentExpect;
        return '<span onclick="switchPeriod(\'' + p.period + '\')" style="background:' + (isActive ? '#8b5cf6' : '#fff') + ';padding:4px 10px;border-radius:4px;font-size:12px;color:' + (isActive ? '#fff' : '#333') + ';border:1px solid ' + (isActive ? '#8b5cf6' : '#d9d9d9') + ';cursor:pointer;transition:all 0.2s ease;">' + (p.label || p.period) + '</span>';
    }).join('');
}

/* ========== 全局变量：所有期次数据 ========== */
let allPeriodsData = null;

/* ========== 获取比赛数据 ========== */
/**
 * 从服务器获取比赛数据
 * 支持新格式（多期对象）和旧格式（单期数组）
 * @param {string|null} expect - 指定期号，为null时使用当前期
 * @returns {Promise<boolean>} 是否获取成功
 */
async function fetchMatchData(expect = null) {
    try {
        // 添加时间戳防止缓存
        const url = '/zjq4_data.json?t=' + Date.now();
        const response = await fetch(url);
        if (!response.ok) throw new Error('数据获取失败');
        const data = await response.json();
        
        // 保存全部期次数据
        allPeriodsData = data;
        
        // 过滤掉已过期的期次
        let activePeriodsList = [];
        if (data.periods_list && data.periods) {
            activePeriodsList = data.periods_list.filter(p => {
                const pData = data.periods[p.period];
                return pData && !isPeriodExpired(pData.deadline);
            });
        }
        
        // 确定要显示的期次（优先选择未过期的）
        let targetPeriod = findActivePeriod(activePeriodsList, data.periods);
        if (!targetPeriod) {
            targetPeriod = expect || data.current || data.period;
        }
        let periodData = null;
        
        // 新格式：data.periods 是对象
        if (data.periods && typeof data.periods === 'object' && !Array.isArray(data.periods) && data.periods[targetPeriod]) {
            periodData = data.periods[targetPeriod];
        }
        
        // 兼容旧格式：data.periods 是数组
        if (!periodData && data.periods && Array.isArray(data.periods) && data.periods.length > 0) {
            periodsData = data.periods;
        }
        
        // 兼容旧格式：直接有 matches
        if (!periodData && data.matches) {
            periodData = data;
        }
        
        // 处理获取到的期次数据
        if (periodData && periodData.matches && periodData.matches.length > 0) {
            // 清空当前数据
            matchData.length = 0;
            matchDataMap.clear();
            
            // 填充比赛数据
            periodData.matches.forEach((m, index) => {
                if (!m.id) m.id = m.matchNum || (index + 1).toString();
                matchData.push(m);
                matchDataMap.set(String(m.id), m);
                if (!selections[m.id]) selections[m.id] = [];
            });
            
            // 更新期号显示
            currentExpect = targetPeriod;
            getCachedElement('current-period').textContent = targetPeriod + '期';
            if (periodData.deadline) getCachedElement('deadline').textContent = '截止时间：' + periodData.deadline;
            
            // 控制多期选择栏的显示
            const multiPeriodBar = getCachedElement('multi-period-bar');
            if (data.periods_list && data.periods_list.length > 1) {
                multiPeriodBar.style.display = 'block';
                renderPeriodTabs();
            } else if (periodsData && periodsData.length > 1) {
                multiPeriodBar.style.display = 'block';
                renderPeriodTabs();
            } else {
                multiPeriodBar.style.display = 'none';
            }
            
            // 清空所有选择
            Object.keys(selections).forEach(key => { selections[key] = []; });
            
            // 渲染界面
            renderMatches();
            updateBottomBar();
            getCachedElement('header-time').textContent = data.updateTime || new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
            return true;
        }
        throw new Error('无比赛数据');
    } catch (error) {
        console.error('获取数据失败:', error);
        // 获取失败时加载模拟数据
        loadMockData();
        renderMatches();
        getCachedElement('header-time').textContent = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
        return false;
    }
}

/* ========== 加载模拟数据 ========== */
/**
 * 当无法从服务器获取数据时，加载模拟比赛数据
 * 用于开发和测试环境
 */
function loadMockData() {
    matchData.length = 0;
    matchDataMap.clear();
    
    // 模拟联赛和球队数据
    const leagues = ['英超', '西甲', '德甲', '意甲'];
    const teams = ['曼联', '利物浦', '切尔西', '阿森纳', '皇马', '巴萨', '拜仁', '多特'];
    
    // 生成4场模拟比赛
    for (let i = 0; i < 4; i++) {
        const m = {
            id: i + 1,
            matchNum: (i + 1).toString(),
            league: leagues[i % leagues.length],
            time: String(20 + Math.floor(Math.random() * 4)).padStart(2, '0') + ':' + String(Math.floor(Math.random() * 60)).padStart(2, '0'),
            home: teams[Math.floor(Math.random() * teams.length)],
            away: teams[Math.floor(Math.random() * teams.length)]
        };
        matchData.push(m);
        matchDataMap.set(String(m.id), m);
        if (!selections[m.id]) selections[m.id] = [];
    }
}

/* ========== 渲染比赛列表 ========== */
/**
 * 渲染所有比赛数据到页面
 */
function renderMatches() {
    const container = document.getElementById('match-list');
    if (matchData.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
        return;
    }
    let html = '<div class="match-section">';
    // 遍历所有比赛，生成HTML
    matchData.forEach(m => { html += renderMatchItem(m); });
    html += '</div>';
    container.innerHTML = html;
}

/* ========== 渲染单场比赛 ========== */
/**
 * 渲染单场比赛的HTML
 * @param {Object} m - 比赛数据对象
 * @returns {string} HTML字符串
 */
function renderMatchItem(m) {
    const matchIdStr = String(m.id);
    if (!selections[matchIdStr]) selections[matchIdStr] = [];
    const sel = selections[matchIdStr];
    const hasSelection = sel.length > 0;  // 该场比赛是否有选择
    
    // 生成进球选项网格
    let gridHtml = '<div class="zjq-grid">';
    zjqOptions.forEach(opt => {
        const isSelected = sel.includes(opt);
        gridHtml += '<div class="zjq-item ' + (isSelected ? 'selected' : '') + '" onclick="toggleOdds(' + m.id + ', \'' + opt + '\')">';
        gridHtml += '<div class="label">' + opt + '</div>';
        gridHtml += '</div>';
    });
    gridHtml += '</div>';
    
    // 返回完整的比赛HTML
    return `
            <div class="match-item ${hasSelection ? 'has-selection' : ''}">
                <div class="match-info">
                    <span class="match-num">${m.matchNum}</span>
                    <span class="match-league">${m.league}</span>
                    <span class="match-time">${m.time}</span>
                    <span class="match-status">销售中</span>
                </div>
                <div class="teams">
                    <div class="team home">
                        <div class="team-name">${m.home}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team away">
                        <div class="team-name">${m.away}</div>
                    </div>
                </div>
                ${gridHtml}
            </div>`;
}

/* ========== 选择/取消选择进球数 ========== */
/**
 * 切换某个比赛的进球数选择状态
 * @param {string|number} matchId - 比赛ID
 * @param {string} selection - 进球数选项（如'0', '1', '2'等）
 */
function toggleOdds(matchId, selection) {
    const matchIdStr = String(matchId);
    if (!selections[matchIdStr]) selections[matchIdStr] = [];
    
    const sel = selections[matchIdStr];
    const idx = sel.indexOf(selection);
    
    // 如果已选中则取消，否则添加
    if (idx > -1) {
        sel.splice(idx, 1);
    } else {
        sel.push(selection);
    }
    
    // 重新渲染比赛列表和底部栏
    renderMatches();
    updateBottomBar();
}

/* ========== 获取已选择的比赛数量 ========== */
/**
 * 计算用户已选择多少场比赛
 * @returns {number} 已选择的比赛数量
 */
function getSelectedMatchCount() {
    let count = 0;
    for (const id in selections) {
        if (selections[id].length > 0) count++;
    }
    return count;
}

/* ========== 更新底部投注栏 ========== */
/**
 * 更新底部投注栏的显示状态和数据
 * 包括已选场数、注数、金额等
 */
function updateBottomBar() {
    const matchCount = getSelectedMatchCount();
    const betExtra = getCachedElement('bet-extra');
    const bottomBar = document.querySelector('.bottom-bar');
    const submitBtn = getCachedElement('submit-btn');
    const betTip = getCachedElement('bet-tip');
    const matchCountEl = getCachedElement('match-count');
    
    // 有选择时显示底部栏
    if (matchCount > 0) {
        bottomBar.style.display = 'block';
        setTimeout(() => bottomBar.classList.add('show'), 10);
        matchCountEl.textContent = matchCount;
        
        // 未选满4场时的提示
        if (matchCount < MAX_MATCHES) {
            betExtra.classList.remove('show');
            betTip.textContent = '还需选择' + (MAX_MATCHES - matchCount) + '场';
            betTip.style.color = 'var(--warning)';
            submitBtn.disabled = true;
        } else {
            // 选满4场时显示详细信息
            betExtra.classList.add('show');
            betTip.textContent = '已选满4场';
            betTip.style.color = 'var(--success)';
            submitBtn.disabled = false;
            
            // 计算注数和金额
            const totalBets = calculateBets();
            getCachedElement('bet-count').textContent = totalBets;
            getCachedElement('bet-money').textContent = (totalBets * 2 * times).toFixed(0);
            getCachedElement('bonus-amount').textContent = PRIZE_POOL.toFixed(2);
        }
    } else {
        // 无选择时隐藏底部栏
        bottomBar.classList.remove('show');
        setTimeout(() => {
            if (!bottomBar.classList.contains('show')) bottomBar.style.display = 'none';
        }, 300);
        betExtra.classList.remove('show');
    }
}

/* ========== 计算投注注数 ========== */
/**
 * 根据用户选择计算总注数
 * 采用复式投注方式，每场选择的选项数相乘
 * @returns {number} 总注数，未选满4场返回0
 */
function calculateBets() {
    let total = 1;
    let selectedCount = 0;
    
    // 遍历所有比赛，计算连乘
    for (const id in selections) {
        if (selections[id].length > 0) {
            total *= selections[id].length;  // 复式：各场选择数相乘
            selectedCount++;
        }
    }
    
    // 必须选满4场才有效
    return selectedCount === MAX_MATCHES ? total : 0;
}

/* ========== 确认投注 ========== */
/**
 * 提交投注，显示确认弹窗
 */
function submitBet() {
    // 验证是否选满4场
    const matchCount = getSelectedMatchCount();
    if (matchCount !== MAX_MATCHES) return;
    
    // 计算金额
    const totalBets = calculateBets();
    const totalMoney = totalBets * 2 * times;
    
    // 构建确认信息
    let confirmMsg = '投注确认\n\n';
    confirmMsg += '4场总进球\n';
    confirmMsg += '投注注数：' + totalBets + ' 注\n';
    confirmMsg += '投注倍数：' + times + ' 倍\n';
    confirmMsg += '投注金额：' + totalMoney + ' 元\n\n';
    confirmMsg += '是否确认投注？';
    
    // 用户确认后清空选择
    if (confirm(confirmMsg)) {
        alert('投注成功！\n\n共 ' + totalBets + ' 注，' + totalMoney + ' 元');
        for (const id in selections) selections[id] = [];
        times = 1;
        document.getElementById('times-input').value = 1;
        renderMatches();
        updateBottomBar();
    }
}

/* ========== 初始化 ========== */
/**
 * 页面初始化函数
 * 获取数据并设置定时刷新
 */
async function init() { updateTime();
    updateTime();
await fetchMatchData();
    // 每2分钟刷新一次数据
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(fetchMatchData, 120000);
}

// 执行初始化
init();

/* ========== 倍数控制事件绑定 ========== */
// 减少倍数
document.getElementById('times-minus').addEventListener('click', () => {
    if (times > 1) {
        times--;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

// 增加倍数
document.getElementById('times-plus').addEventListener('click', () => {
    if (times < 99) {
        times++;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

// 倍数输入框变化
document.getElementById('times-input').addEventListener('change', (e) => {
    let val = parseInt(e.target.value) || 1;
    if (val < 1) val = 1;    // 最小值限制
    if (val > 99) val = 99;  // 最大值限制
    times = val;
    e.target.value = times;
    updateBottomBar();
});

/* ========== 清空按钮事件 ========== */
// 清空所有选择并重置倍数
document.getElementById('clear-btn').addEventListener('click', () => {
    for (const id in selections) selections[id] = [];
    times = 1;
    document.getElementById('times-input').value = 1;
    renderMatches();
    updateBottomBar();
});

/* ========== 确认投注按钮事件 ========== */
document.getElementById('submit-btn').addEventListener('click', submitBet);</script></body></html>
