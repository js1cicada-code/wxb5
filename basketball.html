<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞彩篮球选号</title>
    <style>
        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: #fb923c;
            --secondary: #ff8c00;
            --accent: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f5f5f5;
            --bg-card: #ffffff;
            --bg-elevated: #fafafa;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-light: #f0f0f0;
            --border-medium: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
            --transition-slow: 300ms ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; min-height: 100vh; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 0 12px; height: 54px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
        .header-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .header-content { flex: 1; text-align: center; }
        .header h1 { color: #fff; font-size: 17px; font-weight: 600; line-height: 1.2; }
        .header-time { color: rgba(255,255,255,0.85); font-size: 11px; margin-top: 2px; }
        
        .match-section { background: var(--bg-card); margin-bottom: 10px; border-radius: var(--radius-md); margin: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .match-item { padding: 10px 12px; border-bottom: 1px solid var(--border-light); transition: background var(--transition-fast); }
        .match-item:last-child { border-bottom: none; }
        .match-item:active { background: var(--bg-elevated); }
        .match-info { display: flex; align-items: center; margin-bottom: 6px; }
        .match-num { padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; }
        .match-num.day-1 { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .match-num.day-2 { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .match-num.day-3 { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); }
        .match-num.day-4 { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .match-num.day-5 { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .match-num.day-6 { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .match-num.day-7 { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .match-league { font-size: 11px; color: var(--primary); font-weight: 600; margin-right: 6px; }
        .match-time { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
        .match-status { font-size: 9px; color: var(--warning); background: #fffbeb; padding: 2px 6px; border-radius: var(--radius-sm); font-weight: 500; }
        .match-status.closed { color: var(--text-muted); background: var(--bg-elevated); }
        .analysis-btn { font-size: 10px; color: #fff; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 1px 5px; border-radius: 3px; cursor: pointer; font-weight: 500; white-space: nowrap; margin-left: auto; }
        .analysis-btn:active { transform: scale(0.95); }
        
        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .team { flex: 1; text-align: center; }
        .team.away { text-align: right; padding-right: 10px; }
        .team.home { text-align: left; padding-left: 10px; }
        .team-name { font-size: 13px; color: var(--text-primary); font-weight: 600; }
        .team-name .rank { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .team-rank { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .vs { font-size: 11px; color: var(--text-muted); padding: 0 8px; font-weight: 500; }
        
        .odds-row { display: flex; gap: 6px; }
        .odds-row.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 6px; margin: 4px 0; background: linear-gradient(135deg, #fff7ed 0%, #fff 100%); box-shadow: 0 2px 4px rgba(249, 115, 22, 0.1); }
        .odds-item { flex: 1; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); padding: 6px 4px; text-align: center; cursor: pointer; transition: all var(--transition-normal); position: relative; overflow: hidden; }
        .odds-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .odds-item:active { transform: translateY(0) scale(0.98); }
        .odds-item.selected { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15); }
        .odds-item.disabled { background: var(--bg-main); cursor: not-allowed; opacity: 0.6; }
        .odds-item .label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
        .odds-item .value { font-size: 14px; color: var(--text-primary); font-weight: 700; }
        
        .rqspf-label { font-size: 11px; color: var(--warning); margin-bottom: 4px; font-weight: 500; }
        
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); padding: 12px 12px; display: none; transform: translateY(100%); transition: transform var(--transition-slow); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .bottom-bar.show { display: block; transform: translateY(0); }
        .bet-info { display: flex; align-items: center; justify-content: space-between; }
        .bet-stats { display: flex; flex-direction: column; gap: 2px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .bet-tip { font-size: 11px; color: var(--text-muted); }
        .clear-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 8px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); display: flex; align-items: center; gap: 4px; transition: all var(--transition-fast); font-weight: 500; }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; }
        .bet-extra { display: none; padding-top: 12px; border-top: 1px solid var(--border-light); margin-top: 10px; }
        .bet-extra.show { display: block; }
        .bet-extra-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .bet-extra-title { font-size: 15px; color: var(--text-primary); font-weight: 600; }
        .bonus { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bonus span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .pass-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .pass-option { padding: 8px 14px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); font-size: 14px; color: var(--text-secondary); cursor: pointer; background: var(--bg-card); transition: all var(--transition-fast); font-weight: 500; }
        .pass-option:hover { border-color: var(--primary); color: var(--primary); }
        .pass-option.selected { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3); }
        .pass-option:disabled { background: var(--bg-elevated); color: var(--text-muted); border-color: var(--border-light); cursor: not-allowed; opacity: 0.6; }
        .bet-summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
        .bet-summary-item .label { color: var(--text-secondary); }
        .bet-summary-item span:not(.label) { color: var(--primary); font-weight: 700; }
        .times-row { display: flex; align-items: center; justify-content: space-between; }
        .times-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .times-control { display: flex; align-items: center; gap: 10px; }
        .times-btn { width: 32px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--text-secondary); font-weight: 600; line-height: 30px; text-align: center; transition: all var(--transition-fast); }
        .times-btn:hover { border-color: var(--primary); color: var(--primary); }
        .times-input { width: 56px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-primary); background: var(--bg-card); transition: border-color var(--transition-fast); }
        .times-input:focus { border-color: var(--primary); outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3); margin-top: 12px; }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; opacity: 0; transition: opacity var(--transition-normal); backdrop-filter: blur(2px); }
        .modal.show { display: flex; align-items: flex-end; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-height: 80vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; transform: translateY(100%); transition: transform var(--transition-slow) cubic-bezier(0.16, 1, 0.3, 1); }
        .modal.show .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-light); }
        .modal-header h3 { font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .modal-header .close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .modal-body { padding: 16px; max-height: 60vh; overflow-y: auto; }
        
        .sfc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .sfc-grid.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 8px; background: linear-gradient(135deg, #fff7ed 0%, #fff 100%); }
        .sfc-item { padding: 8px 4px; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 11px; cursor: pointer; transition: all var(--transition-fast); }
        .sfc-item:hover { border-color: var(--primary); transform: translateY(-1px); }
        .sfc-item.selected { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15); }
        .sfc-item .label { font-weight: 700; color: var(--text-primary); }
        .sfc-item .odd { color: var(--primary); font-weight: 500; margin-top: 2px; }
        
        .more-plays-btn { display: flex; align-items: center; justify-content: center; padding: 8px 12px; color: var(--text-secondary); font-size: 11px; cursor: pointer; background: var(--bg-card); border-radius: var(--radius-md); margin-top: 8px; transition: all var(--transition-fast); font-weight: 500; border: 1px solid var(--border-light); }
        .more-plays-btn:hover { background: var(--bg-elevated); border-color: var(--border-medium); }
        .more-plays-btn .arrow { margin-left: 4px; font-size: 10px; }
        .more-plays-btn sup { background: var(--text-muted); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 8px; margin-left: 6px; font-weight: 600; }
        
        .more-plays-tabs { display: flex; gap: 8px; padding: 12px 12px 0; }
        .more-plays-tab { flex: 1; padding: 8px; font-size: 12px; color: var(--text-secondary); text-align: center; cursor: pointer; border-radius: var(--radius-sm); position: relative; transition: all var(--transition-fast); font-weight: 500; background: var(--bg-elevated); border: 1px solid var(--border-light); }
        .more-plays-tab:hover { border-color: var(--border-medium); }
        .more-plays-tab.active { color: var(--text-primary); background: var(--bg-card); border-color: var(--border-medium); font-weight: 600; }
        .more-plays-tab sup { position: absolute; top: -4px; right: -4px; background: var(--text-muted); color: #fff; font-size: 8px; padding: 0 4px; border-radius: 8px; min-width: 12px; text-align: center; line-height: 12px; font-weight: 600; }
        .more-plays-tab.active sup { background: var(--primary); }
        .more-plays-body { padding: 12px; }
        
        .match-list { padding-bottom: 120px; }
        
        @media (min-width: 768px) {
            body { background: #f0f2f5; min-height: 100vh; }
            .header { max-width: 1200px; margin: 16px auto 0; border-radius: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
            .tabs { max-width: 1200px; margin: 0 auto; border-radius: 0; background: #fff; }
            .match-list { max-width: 1200px; margin: 0 auto; padding: 12px; padding-bottom: 140px; }
            .match-section { display: block; margin: 0; background: #fff; border-radius: 4px; overflow: hidden; }
            .match-item { border-radius: 0; border-bottom: 1px solid #f0f0f0; }
            .match-item:hover { transform: none; background: #fafafa; box-shadow: none; }
            .match-item:last-child { border-bottom: none; }
            .tab:hover { background: transparent; }
            .bottom-bar { max-width: 1200px; left: 50%; transform: translateX(-50%) translateY(100%); margin: 0; border-radius: 4px 4px 0 0; }
            .bottom-bar.show { transform: translateX(-50%) translateY(0); }
            .modal.show { align-items: center; justify-content: center; }
            .modal-content { max-width: 500px; max-height: 80vh; border-radius: var(--radius-lg); }
        }
        
        @media (min-width: 1024px) {
            body { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-back" onclick="window.location.href='index.html'"></div>
    <div class="header-content">
        <h1>竞彩篮球</h1>
        <div class="header-time" id="header-time"></div>
    </div>
</div>

<div id="match-list" class="match-list"></div>

<div class="bottom-bar">
    <div class="bet-info">
        <div class="bet-stats">
            <div class="bet-amount">已选 <span id="match-count">0</span> 场</div>
            <div class="bet-tip" id="bet-tip">至少选择2场比赛</div>
        </div>
        <button class="clear-btn" id="clear-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            清空
        </button>
    </div>
    <div class="bet-extra" id="bet-extra">
        <div class="bet-extra-top">
            <span class="bet-extra-title">过关方式</span>
            <span class="bonus">预测奖金: <span id="bonus-amount">0.00</span> 元</span>
        </div>
        <div class="pass-options" id="pass-options"></div>
        <div class="bet-summary">
            <div class="bet-summary-item"><span class="label">投注注数：</span><span id="bet-count">0</span> 注</div>
            <div class="bet-summary-item"><span class="label">投注金额：</span><span id="bet-money">0</span> 元</div>
        </div>
        <div class="times-row">
            <span class="times-label">投注倍数</span>
            <div class="times-control">
                <button class="times-btn" id="times-minus">-</button>
                <input type="number" class="times-input" id="times-input" value="1" min="1" max="50">
                <button class="times-btn" id="times-plus">+</button>
            </div>
        </div>
        <button class="submit-btn" id="submit-btn">确认选号</button>
    </div>
</div>

<div class="modal" id="sfc-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>选择胜分差</h3>
            <span class="close" onclick="closeModal('sfc-modal')">&times;</span>
        </div>
        <div class="modal-body">
            <div class="sfc-grid" id="sfc-grid"></div>
        </div>
    </div>
</div>

<div class="modal" id="more-plays-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="more-plays-title">更多玩法</h3>
            <span class="close" onclick="closeModal('more-plays-modal')">&times;</span>
        </div>
        <div class="modal-body" style="padding:0">
            <div class="more-plays-tabs" id="more-plays-tabs"></div>
            <div class="more-plays-body" id="more-plays-body"></div>
        </div>
    </div>
</div>

<script>
    class BatchUpdater {
        constructor() {
            this.pending = false;
            this.updates = [];
        }
        add(updateFn) {
            this.updates.push(updateFn);
            if (!this.pending) {
                this.pending = true;
                requestAnimationFrame(() => this.flush());
            }
        }
        flush() {
            const updates = this.updates;
            this.updates = [];
            this.pending = false;
            updates.forEach(fn => fn());
        }
    }
    
    function getCachedElement(id) {
        if (!domCache.has(id)) {
            domCache.set(id, document.getElementById(id));
        }
        return domCache.get(id);
    }
    
    function getMatch(id) {
        return matchDataMap.get(parseInt(id)) || matchDataMap.get(String(id));
    }
    
    const matchData = [];
    const matchDataMap = new Map();
    const selections = {};
    const singlePassStatus = {};
    const domCache = new Map();
    const batchUpdater = new BatchUpdater();
    let currentPlayType = 'mixed';
    let currentModalMatchId = null;
    let currentPassType = 0;
    let times = 1;
    let prevMatchCount = 0;
    let updateInterval = null;
    let currentMorePlaysMatchId = null;
    let currentMorePlaysTab = 'sfc';
    
    const poolCodeMap = {
        'sf': 'MNL',
        'rfsf': 'HDC',
        'sfc': 'WNM',
        'dxf': 'HILO'
    };
    
    async function fetchSinglePassStatus() {
        try {
            const response = await fetch('https://webapi.sporttery.cn/gateway/uniform/basketball/getMatchListV1.qry?clientCode=3001', {
                headers: {
                    'Referer': 'https://www.sporttery.cn/jc/lqszsc/'
                }
            });
            const data = await response.json();
            
            if (data.success && data.value && data.value.matchInfoList) {
                data.value.matchInfoList.forEach(dayMatch => {
                    if (dayMatch.subMatchList) {
                        dayMatch.subMatchList.forEach(match => {
                            const matchId = match.matchId;
                            if (match.poolList) {
                                singlePassStatus[matchId] = {};
                                match.poolList.forEach(pool => {
                                    const isSinglePass = pool.cbtValue == 1 && pool.cbtSingle == 1;
                                    singlePassStatus[matchId][pool.poolCode] = {
                                        available: pool.cbtValue == 1,
                                        singlePass: isSinglePass
                                    };
                                });
                            }
                        });
                    }
                });
                return true;
            }
            return false;
        } catch (error) {
            console.error('获取单关状态失败:', error);
            return false;
        }
    }
    
    function isSinglePassAvailable(matchId, playType) {
        const status = singlePassStatus[matchId];
        if (!status) return false;
        const poolCode = poolCodeMap[playType];
        return status[poolCode] && status[poolCode].singlePass;
    }
    
    function getSinglePassLabel(matchId, playType) {
        if (isSinglePassAvailable(matchId, playType)) {
            return '<span style="background:#fff7ed;color:#ea580c;font-size:9px;padding:1px 3px;border-radius:2px;margin-left:4px;">单关</span>';
        }
        return '';
    }
    
    const passOptions = [
        { label: '单关', value: 1 },
        { label: '2串1', value: 2 },
        { label: '3串1', value: 3 },
        { label: '4串1', value: 4 },
        { label: '5串1', value: 5 },
        { label: '6串1', value: 6 },
        { label: '7串1', value: 7 },
        { label: '8串1', value: 8 }
    ];
    
    const sfcOptions = ['主胜1-5','主胜6-10','主胜11-15','主胜16-20','主胜21-25','主胜26+','客胜1-5','客胜6-10','客胜11-15','客胜16-20','客胜21-25','客胜26+'];
    
    let rankDataMap = new Map();
    
    async function fetchRankData() {
        try {
            const response = await fetch('data/basketball_matches.json');
            const data = await response.json();
            if (data.matches) {
                data.matches.forEach(m => {
                    rankDataMap.set(m.matchId, { homeRank: m.homeRank, awayRank: m.awayRank });
                });
            }
        } catch (e) {
            console.log('加载排名数据失败:', e);
        }
    }
    
    async function fetchMatchData() {
        await fetchRankData();
        try {
            const response = await fetch('https://webapi.sporttery.cn/gateway/uniform/basketball/getMatchCalculatorV1.qry?channel=1');
            const data = await response.json();
            
            if (data.success && data.value && data.value.matchInfoList) {
                matchData.length = 0;
                matchDataMap.clear();
                
                data.value.matchInfoList.forEach(dayMatch => {
                    if (dayMatch.subMatchList) {
                        dayMatch.subMatchList.forEach(match => {
                            const rankInfo = rankDataMap.get(match.matchId) || {};
                            const item = {
                                id: match.matchId,
                                matchNumStr: match.matchNumStr,
                                home: match.homeTeamAbbName,
                                away: match.awayTeamAbbName,
                                league: match.leagueAbbName,
                                time: match.matchTime.substring(0, 5),
                                homeRank: rankInfo.homeRank || '',
                                awayRank: rankInfo.awayRank || '',
                                sf: null,
                                rfsf: null,
                                sfc: null,
                                dxf: null
                            };
                            
                            // 胜负
                            if (match.mnl) {
                                const homeOdds = parseFloat(match.mnl.h) || 0;
                                const awayOdds = parseFloat(match.mnl.a) || 0;
                                item.sf = [homeOdds, awayOdds];
                            }
                            
                            // 让分胜负
                            if (match.hdc) {
                                item.rfsf = {
                                    handicap: parseFloat(match.hdc.goalLine) || 0,
                                    odds: [
                                        parseFloat(match.hdc.h) || 0,
                                        parseFloat(match.hdc.a) || 0
                                    ]
                                };
                            }
                            
                            // 胜分差
                            if (match.wnm) {
                                item.sfc = [
                                    parseFloat(match.wnm.w1) || 0,
                                    parseFloat(match.wnm.w2) || 0,
                                    parseFloat(match.wnm.w3) || 0,
                                    parseFloat(match.wnm.w4) || 0,
                                    parseFloat(match.wnm.w5) || 0,
                                    parseFloat(match.wnm.w6) || 0,
                                    parseFloat(match.wnm.l1) || 0,
                                    parseFloat(match.wnm.l2) || 0,
                                    parseFloat(match.wnm.l3) || 0,
                                    parseFloat(match.wnm.l4) || 0,
                                    parseFloat(match.wnm.l5) || 0,
                                    parseFloat(match.wnm.l6) || 0
                                ];
                            }
                            
                            // 大小分
                            if (match.hilo) {
                                item.dxf = {
                                    base: parseFloat(match.hilo.goalLine) || 0,
                                    odds: [
                                        parseFloat(match.hilo.h) || 0,
                                        parseFloat(match.hilo.l) || 0
                                    ]
                                };
}
                             
                             const matchNumStr = match.matchNumStr || '';
                             const dayMap = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
                             let matchDayOfWeek = 0;
                             for (const [day, num] of Object.entries(dayMap)) {
                                 if (matchNumStr.startsWith(day)) {
                                     matchDayOfWeek = num;
                                     break;
                                 }
                             }
                             item.dayOfWeek = matchDayOfWeek;
                                
                                matchData.push(item);
                              matchDataMap.set(item.id, item);
                            
                            if (!selections[match.matchId]) {
                                selections[match.matchId] = { sf: [], rfsf: [], sfc: [], dxf: [] };
                            }
                        });
                    }
                });
                
                renderMatches();
                updateTime();
                return true;
            }
            return false;
        } catch (error) {
            console.error('获取数据失败:', error);
            return false;
        }
    }
    
    function isSellingTime() {
        const now = new Date();
        const day = now.getDay() || 7;
        const hour = now.getHours();
        if (day === 0 || day === 6) {
            return hour >= 11 && hour < 23;
        } else {
            return hour >= 11 && hour < 22;
        }
    }
    
    function getSellingStatus() {
        return isSellingTime() ? '销售中' : '已停售';
    }
    
    function isBeforeSellingTime() {
        const now = new Date();
        const hour = now.getHours();
        return hour < 11;
    }
    
    function isAfterSellingTime() {
        const now = new Date();
        const day = now.getDay() || 7;
        const hour = now.getHours();
        if (day === 0 || day === 6) {
            return hour >= 23;
        } else {
            return hour >= 22;
        }
    }
    
    function getDayClass(matchNumStr) {
        const dayMap = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
        for (const [day, num] of Object.entries(dayMap)) {
            if (matchNumStr && matchNumStr.startsWith(day)) {
                return 'day-' + num;
            }
        }
        return 'day-1';
    }
    
    function formatOdd(value) {
        return parseFloat(value).toFixed(2);
    }
    
    function isPlayAvailable(odds) {
        if (!odds) return false;
        if (Array.isArray(odds)) {
            return odds.some(o => o > 0);
        }
        if (odds.odds && Array.isArray(odds.odds)) {
            return odds.odds.some(o => o > 0);
        }
        return false;
    }
    
    function openAnalysis(matchId) {
        window.location.href = 'basketball_analysis.html?id=' + matchId;
    }
    
    function formatRank(rank) {
            if (!rank) return '';
            // 提取数字，例如 "[欧篮联7]" -> "[7]"
            const match = rank.match(/\[(.*?)\]/);
            if (match) {
                const parts = match[1].match(/\d+/);
                if (parts) {
                    return '<span class="rank">[' + parts[0] + ']</span>';
                }
            }
            return '';
        }
        
        function renderMatches() {
        const container = document.getElementById('match-list');
        if (matchData.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
            return;
        }
        
        const todayDayOfWeek = new Date().getDay() || 7;
        
        let filteredMatches;
        if (isSellingTime()) {
            const tomorrow = todayDayOfWeek === 7 ? 1 : todayDayOfWeek + 1;
            filteredMatches = matchData.filter(m => {
                if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                return m.dayOfWeek === todayDayOfWeek || m.dayOfWeek === tomorrow;
            });
        } else if (isBeforeSellingTime()) {
            filteredMatches = matchData.filter(m => {
                if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                return m.dayOfWeek >= todayDayOfWeek;
            });
        } else {
            const tomorrow = todayDayOfWeek === 7 ? 1 : todayDayOfWeek + 1;
            filteredMatches = matchData.filter(m => {
                if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                return m.dayOfWeek >= tomorrow;
            });
        }
        
        if (filteredMatches.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
            return;
        }
        
        let html = '<div class="match-section">';
        filteredMatches.forEach(m => { html += renderMatchItem(m); });
        html += '</div>';
        container.innerHTML = html;
    }

    function toggleOdds(matchId, playType, idx) {
        const arr = selections[matchId][playType];
        const pos = arr.indexOf(idx);
        if (pos > -1) {
            arr.splice(pos, 1);
        } else {
            const currentCount = getSelectedMatchCount();

                alert('最多只能选择8场比赛');
                return;
            }
            arr.push(idx);
        }
        renderMatches();
        updateBottomBar();
    }

    function getSelectedMatchCount() {
        let count = 0;
        for (const id in selections) {
            const sel = selections[id];
            if (currentPlayType === 'mixed') {
                if (sel.sf.length > 0 || sel.rfsf.length > 0 || sel.sfc.length > 0 || sel.dxf.length > 0) count++;
            } else {
                if (sel[currentPlayType].length > 0) count++;
            }
        }
        return count;

    function isMatchSelected(matchId) {
        const sel = selections[matchId];
        return sel.sf.length > 0 || sel.rfsf.length > 0 || sel.sfc.length > 0 || sel.dxf.length > 0;
    }
    
    function updateBottomBar() {
        let matchCount = 0;
        const selectedOdds = [];
        
        if (currentPlayType === 'mixed') {
            for (const id in selections) {
                const sel = selections[id];
                const m = getMatch(id);
                if (!m) continue;
                let odds = [];
                if (sel.sf.length > 0 && m.sf) odds = odds.concat(sel.sf.map(i => m.sf[i]));
                if (sel.rfsf.length > 0 && m.rfsf) odds = odds.concat(sel.rfsf.map(i => m.rfsf.odds[i]));
                if (sel.sfc.length > 0 && m.sfc) odds = odds.concat(sel.sfc.map(i => m.sfc[i]));
                if (sel.dxf.length > 0 && m.dxf) odds = odds.concat(sel.dxf.map(i => m.dxf.odds[i]));
                if (odds.length > 0) {
                    matchCount++;
                    selectedOdds.push(odds);
                }
            }
        } else {
            for (const id in selections) {
                const sel = selections[id][currentPlayType];
                if (sel.length > 0) {
                    matchCount++;
                    const m = getMatch(id);
                    if (!m) continue;
                    let odds = [];
                    if (currentPlayType === 'sf') odds = sel.map(i => m.sf[i]);
                    else if (currentPlayType === 'rfsf') odds = sel.map(i => m.rfsf.odds[i]);
                    else if (currentPlayType === 'sfc') odds = sel.map(i => m.sfc[i]);
                    else if (currentPlayType === 'dxf') odds = sel.map(i => m.dxf.odds[i]);
                    selectedOdds.push(odds);
                }
            }
        }
        
        const betExtra = getCachedElement('bet-extra');
        const clearBtn = getCachedElement('clear-btn');
        const bottomBar = document.querySelector('.bottom-bar');
        const betTip = getCachedElement('bet-tip');
        const matchCountEl = getCachedElement('match-count');
        
        if (matchCount > 0) {
            bottomBar.style.display = 'block';
            setTimeout(() => bottomBar.classList.add('show'), 10);
            matchCountEl.textContent = matchCount;
            clearBtn.style.display = 'inline-flex';
            
            if (matchCount < 2) {
                betExtra.classList.remove('show');
                betTip.textContent = '还需选择' + (2 - matchCount) + '场';
                betTip.style.color = 'var(--warning)';
            } else {
                betExtra.classList.add('show');
                betTip.textContent = '已满足最低要求';
                betTip.style.color = 'var(--success)';
                
                if (matchCount !== prevMatchCount) {
                    currentPassType = matchCount - 1;
                    if (currentPassType < 0) currentPassType = 0;
                    prevMatchCount = matchCount;
                }
                
                renderPassOptions(matchCount);
                
                const { totalBets, totalBonus } = calculateBonus(selectedOdds, matchCount);
                document.getElementById('bet-count').textContent = totalBets;
                document.getElementById('bet-money').textContent = (totalBets * 2 * times).toFixed(0);
                document.getElementById('bonus-amount').textContent = totalBonus.toFixed(2);
            }
        } else {
            bottomBar.classList.remove('show');
            setTimeout(() => {
                if (!bottomBar.classList.contains('show')) bottomBar.style.display = 'none';
            }, 300);
            betExtra.classList.remove('show');
            currentPassType = 0;
            prevMatchCount = 0;
        }
    }
    
    function renderPassOptions(matchCount) {
        const container = document.getElementById('pass-options');
        let html = '';
        passOptions.forEach((opt, idx) => {
            const disabled = opt.value > matchCount ? 'disabled' : '';
            const selected = currentPassType === idx ? 'selected' : '';
            if (opt.value <= 8) {
                html += '<button class="pass-option ' + selected + '" ' + disabled + ' onclick="selectPass(' + idx + ')">' + opt.label + '</button>';
            }
        });
        container.innerHTML = html;
    }
    
    function selectPass(idx) {
        currentPassType = idx;
        updateBottomBar();
    }
    
    function submitBet() {
        let matchCount = 0;
        const selectedOdds = [];
        
        if (currentPlayType === 'mixed') {
            for (const id in selections) {
                const sel = selections[id];
                const m = getMatch(id);
                if (!m) continue;
                let odds = [];
                if (sel.sf.length > 0 && m.sf) odds = odds.concat(sel.sf.map(i => m.sf[i]));
                if (sel.rfsf.length > 0 && m.rfsf) odds = odds.concat(sel.rfsf.map(i => m.rfsf.odds[i]));
                if (sel.sfc.length > 0 && m.sfc) odds = odds.concat(sel.sfc.map(i => m.sfc[i]));
                if (sel.dxf.length > 0 && m.dxf) odds = odds.concat(sel.dxf.map(i => m.dxf.odds[i]));
                if (odds.length > 0) { matchCount++; selectedOdds.push(odds); }
            }
        } else {
            for (const id in selections) {
                const sel = selections[id][currentPlayType];
                if (sel.length > 0) {
                    matchCount++;
                    const m = getMatch(id);
                    if (!m) continue;
                    let odds = [];
                    if (currentPlayType === 'sf') odds = sel.map(i => m.sf[i]);
                    else if (currentPlayType === 'rfsf') odds = sel.map(i => m.rfsf.odds[i]);
                    else if (currentPlayType === 'sfc') odds = sel.map(i => m.sfc[i]);
                    else if (currentPlayType === 'dxf') odds = sel.map(i => m.dxf.odds[i]);
                    selectedOdds.push(odds);
                }
            }
        }
        
        const passLabel = passOptions[currentPassType]?.label || '';
        const { totalBets, totalBonus } = calculateBonus(selectedOdds, matchCount);
        const totalMoney = totalBets * 2 * times;
        
        let confirmMsg = '投注确认\n\n';
        confirmMsg += '过关方式：' + passLabel + '\n';
        confirmMsg += '已选场次：' + matchCount + ' 场\n';
        confirmMsg += '投注注数：' + totalBets + ' 注\n';
        confirmMsg += '投注倍数：' + times + ' 倍\n';
        confirmMsg += '投注金额：' + totalMoney + ' 元\n';
        confirmMsg += '预计奖金：' + totalBonus.toFixed(2) + ' 元\n\n';
        confirmMsg += '是否确认投注？';
        
        if (confirm(confirmMsg)) {
            alert('投注成功！\n\n' + passLabel + ' - 共 ' + totalBets + ' 注，' + totalMoney + ' 元');
            for (const id in selections) {
                selections[id] = { sf: [], rfsf: [], sfc: [], dxf: [] };
            }
            times = 1;
            currentPassType = 0;
            document.getElementById('times-input').value = 1;
            renderMatches();
            updateBottomBar();
        }
    }
    
    function calculateBonus(selectedOdds, matchCount) {
        if (selectedOdds.length === 0 || currentPassType >= passOptions.length) {
            return { totalBets: 0, totalBonus: 0 };
        }
        
        const passValue = passOptions[currentPassType].value;
        
        if (passValue === 1) {
            let totalBets = 0;
            let totalBonus = 0;
            selectedOdds.forEach(oddsArr => {
                oddsArr.forEach(odd => {
                    totalBets++;
                    totalBonus += odd * 2 * times;
                });
            });
            return { totalBets, totalBonus };
        }
        
        if (passValue > matchCount) return { totalBets: 0, totalBonus: 0 };
        
        const combinations = getCombinations(selectedOdds, passValue);
        let totalBets = 0;
        let totalBonus = 0;
        
        combinations.forEach(combo => {
            const bets = combo.reduce((acc, arr) => acc * arr.length, 1);
            totalBets += bets;
            
            const oddsProducts = getOddsProducts(combo);
            oddsProducts.forEach(product => {
                let bonus = product * 2 * times;
                if (bonus > 1000000) bonus = 1000000;
                totalBonus += bonus;
            });
        });
        
        return { totalBets, totalBonus };
    }
    
    function getCombinations(arr, size) {
        const result = [];
        function combine(start, combo) {
            if (combo.length === size) {
                result.push([...combo]);
                return;
            }
            for (let i = start; i < arr.length; i++) {
                combo.push(arr[i]);
                combine(i + 1, combo);
                combo.pop();
            }
        }
        combine(0, []);
        return result;
    }
    
    function getOddsProducts(oddsArrays) {
        const result = [];
        function multiply(idx, product) {
            if (idx === oddsArrays.length) {
                result.push(product);
                return;
            }
            oddsArrays[idx].forEach(odd => multiply(idx + 1, product * odd));
        }
        multiply(0, 1);
        return result;
    }
    
    function updateTime() {
        const now = new Date();
        document.getElementById('header-time').textContent = now.toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }) + ' 更新';
    }
    
    async function init() {
        updateTime();
        await fetchSinglePassStatus();
        const success = await fetchMatchData();
        if (!success) {
            document.getElementById('match-list').innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);">数据加载失败，请刷新重试</div>';
        }
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(async () => {
            await fetchSinglePassStatus();
            await fetchMatchData();
            updateTime();
            updateBottomBar();
        }, 120000);
    }
    
    document.getElementById('times-minus').addEventListener('click', () => {
        if (times > 1) {
            times--;
            document.getElementById('times-input').value = times;
            updateBottomBar();
        }
    });
    
    document.getElementById('times-plus').addEventListener('click', () => {
        if (times < 50) {
            times++;
            document.getElementById('times-input').value = times;
            updateBottomBar();
        }
    });
    
    document.getElementById('times-input').addEventListener('change', (e) => {
        let val = parseInt(e.target.value) || 1;
        if (val < 1) val = 1;
        if (val > 50) val = 50;
        times = val;
        e.target.value = times;
        updateBottomBar();
    });
    
    document.getElementById('clear-btn').addEventListener('click', () => {
        for (const id in selections) {
            selections[id] = { sf: [], rfsf: [], sfc: [], dxf: [] };
        }
        times = 1;
        document.getElementById('times-input').value = 1;
        renderMatches();
        updateBottomBar();
    });
    
    document.getElementById('submit-btn').addEventListener('click', submitBet);
    
    init();
</script>
</body>
</html>
