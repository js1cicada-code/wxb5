<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胜负过关选号</title>
    <style>
        /* ========== CSS变量定义 ========== */
        /* 使用CSS变量可以方便地统一管理颜色、间距等样式 */
        :root {
            --primary: #10b981;        /* 主色调：绿色 */
            --primary-dark: #059669;    /* 主色调深色版本 */
            --primary-light: #34d399;   /* 主色调浅色版本 */
            --secondary: #6ee7b7;       /* 次要色：浅绿色 */
            --accent: #fbbf24;          /* 强调色：金色 */
            --success: #10b981;         /* 成功状态：绿色 */
            --danger: #ef4444;          /* 危险状态：红色 */
            --warning: #f59e0b;         /* 警告状态：橙色 */
            --bg-main: #f5f5f5;         /* 主背景色 */
            --bg-card: #ffffff;          /* 卡片背景色 */
            --bg-elevated: #fafafa;     /* 凸起元素背景色 */
            --text-primary: #1f2937;    /* 主要文字颜色 */
            --text-secondary: #6b7280;  /* 次要文字颜色 */
            --text-muted: #9ca3af;      /* 弱化文字颜色 */
            --border-light: #f0f0f0;    /* 浅色边框 */
            --border-medium: #e5e7eb;   /* 中等边框颜色 */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);   /* 小阴影 */
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);   /* 中等阴影 */
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);   /* 大阴影 */
            --radius-sm: 4px;    /* 小圆角 */
            --radius-md: 8px;    /* 中等圆角 */
            --radius-lg: 12px;   /* 大圆角 */
            --transition-fast: 150ms ease;    /* 快速过渡动画 */
            --transition-normal: 200ms ease;  /* 普通过渡动画 */
            --transition-slow: 300ms ease;    /* 慢速过渡动画 */
        }
        
        /* ========== 基础样式重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; min-height: 100vh; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        
        /* ========== 顶部导航栏样式 ========== */
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 0 12px; height: 54px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
        .header-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .header-content { flex: 1; text-align: center; }
        .header h1 { color: #fff; font-size: 17px; font-weight: 600; line-height: 1.2; }
        .header-time { color: rgba(255,255,255,0.85); font-size: 11px; margin-top: 2px; }
        
        /* ========== 期号信息栏 ========== */
        .period-bar { background: var(--bg-card); padding: 10px 12px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
        .period-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .period-label span { color: var(--primary); font-weight: 700; }
        
        /* ========== 比赛列表区域 ========== */
        /* 比赛卡片容器，包含所有比赛项目 */
        .match-section { background: var(--bg-card); margin-bottom: 10px; border-radius: var(--radius-md); margin: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
        
        /* 单场比赛项 */
        .match-item { padding: 10px 12px; border-bottom: 1px solid var(--border-light); transition: background var(--transition-fast); }
        .match-item:last-child { border-bottom: none; }
        .match-item:active { background: var(--bg-elevated); }
        .match-item.has-selection { background: linear-gradient(135deg, rgba(16, 185, 129, 0.03) 0%, rgba(16, 185, 129, 0.01) 100%); } /* 有选中项时的背景 */
        
        /* 比赛信息行：场次号、联赛、时间、状态 */
        .match-info { display: flex; align-items: center; margin-bottom: 6px; }
        .match-num { padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; }
        .match-num.football { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }     /* 足球标识：红色 */
        .match-num.basketball { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }  /* 篮球标识：橙色 */
        .match-num.icehockey { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }  /* 冰球标识：蓝色 */
        .match-league { font-size: 11px; color: var(--primary); font-weight: 600; margin-right: 6px; }
        .match-time { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
        .match-status { font-size: 9px; color: var(--success); background: #ecfdf5; padding: 2px 6px; border-radius: var(--radius-sm); font-weight: 500; }
        
        /* 队伍信息行：主队 VS 客队 */
        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .team { flex: 1; text-align: center; }
        .team.home { text-align: right; padding-right: 10px; }   /* 主队靠右 */
        .team.away { text-align: left; padding-left: 10px; }      /* 客队靠左 */
        .team-name { font-size: 13px; color: var(--text-primary); font-weight: 600; }
        .team-rank { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .vs { font-size: 11px; color: var(--text-muted); padding: 0 8px; font-weight: 500; }
        .handicap { font-size: 11px; color: var(--warning); font-weight: 600; }
        
        /* 赔率选择行：主胜、客胜两个选项 */
        .odds-row { display: flex; gap: 8px; }
        .odds-item { flex: 1; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); padding: 8px 4px; text-align: center; cursor: pointer; transition: all var(--transition-normal); position: relative; overflow: hidden; }
        .odds-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .odds-item:active { transform: translateY(0) scale(0.98); } /* 点击时缩小效果 */
        .odds-item.selected { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15); } /* 选中状态 */
        .odds-item.disabled { background: var(--bg-main); cursor: not-allowed; opacity: 0.6; } /* 禁用状态 */
        .odds-item .label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .odds-item .value { font-size: 16px; color: var(--text-primary); font-weight: 700; margin-top: 2px; }
        .odds-item .handicap-label { font-size: 10px; color: var(--warning); font-weight: 600; }
        
        /* ========== 底部投注栏 ========== */
        /* 固定在页面底部，用户选择比赛后显示 */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); padding: 12px 12px; display: none; transform: translateY(100%); transition: transform var(--transition-slow); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .bottom-bar.show { display: block; transform: translateY(0); }
        
        /* 投注信息区 */
        .bet-info { display: flex; align-items: center; justify-content: space-between; }
        .bet-stats { display: flex; flex-direction: column; gap: 2px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .bet-tip { font-size: 11px; color: var(--text-muted); }
        
        /* 清空按钮 */
        .bet-actions { display: flex; gap: 10px; align-items: center; }
        .clear-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 8px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); display: flex; align-items: center; gap: 4px; transition: all var(--transition-fast); font-weight: 500; }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
        .clear-btn svg { width: 14px; height: 14px; }
        
        /* 投注额外信息区：过关方式、倍数等 */
        .bet-extra { display: none; padding-top: 12px; border-top: 1px solid var(--border-light); margin-top: 12px; }
        .bet-extra.show { display: block; }
        .bet-extra-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .bet-extra-title { font-size: 14px; color: var(--text-primary); font-weight: 600; }
        .bonus { font-size: 13px; color: var(--text-secondary); }
        .bonus span { color: var(--primary); font-weight: 700; }
        
        /* 过关方式选项 */
        .pass-options { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .pass-option { padding: 6px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--bg-card); transition: all var(--transition-fast); font-weight: 500; }
        .pass-option:hover { border-color: var(--primary); color: var(--primary); }
        .pass-option.selected { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3); } /* 选中状态 */
        .pass-option:disabled { background: var(--bg-elevated); color: var(--text-muted); border-color: var(--border-light); cursor: not-allowed; opacity: 0.6; }
        
        /* 投注汇总信息 */
        .bet-summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
        .bet-summary-item .label { color: var(--text-secondary); }
        .bet-summary-item span:not(.label) { color: var(--primary); font-weight: 700; }
        
        /* 倍数选择区 */
        .times-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .times-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .times-control { display: flex; align-items: center; gap: 10px; }
        .times-btn { width: 32px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--text-secondary); font-weight: 600; line-height: 30px; text-align: center; transition: all var(--transition-fast); }
        .times-btn:hover { border-color: var(--primary); color: var(--primary); }
        .times-input { width: 56px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-primary); background: var(--bg-card); transition: border-color var(--transition-fast); }
        .times-input:focus { border-color: var(--primary); outline: none; }
        
        /* 确认投注按钮 */
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3); }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        
        /* ========== 骨架屏加载状态 ========== */
        /* 数据加载时显示的占位动画 */
        .skeleton { background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-main) 50%, var(--bg-elevated) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s ease-in-out infinite; border-radius: var(--radius-sm); }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* 比赛项骨架屏 */
        .match-skeleton { padding: 12px; border-bottom: 1px solid var(--border-light); }
        .match-skeleton-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .match-skeleton-teams { display: flex; justify-content: space-between; align-items: center; }
        .match-skeleton-team { width: 35%; height: 16px; }
        .match-skeleton-vs { width: 30px; height: 12px; }
        .match-skeleton-odds { display: flex; gap: 8px; margin-top: 10px; }
        .match-skeleton-odd { flex: 1; height: 50px; }
        
        /* 比赛列表容器，底部留出空间给投注栏 */
        .match-list { padding-bottom: 120px; }
        
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
        
        @media (min-width: 768px) {
            body { background: linear-gradient(135deg, #f0f0f0 0%, #e5e5e5 100%); min-height: 100vh; }
            .header { max-width: 1200px; margin: 16px auto 0; border-radius: var(--radius-lg); }
            .period-bar { max-width: 1200px; margin: 0 auto; border-radius: var(--radius-md); }
            .tabs { max-width: 1200px; margin: 0 auto; }
            .match-list { max-width: 1200px; margin: 0 auto; padding: 16px 16px 140px; }
            .match-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; margin: 0; background: transparent; }
            .match-item { border-radius: var(--radius-md); cursor: pointer; }
            .match-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
            .tab:hover { background: var(--bg-elevated); }
            .bottom-bar { max-width: 1200px; margin: 0 auto 16px; border-radius: var(--radius-lg); }
            .modal.show { align-items: center; justify-content: center; }
            .modal-content { max-width: 500px; border-radius: var(--radius-lg); }
        }
        @media (min-width: 1024px) {
            .match-section { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-back" onclick="window.location.href='index.html'"></div>
    <div class="header-content">
        <h1>胜负过关</h1>
        <div class="header-time" id="header-time"></div>
    </div>
</div>

<!-- ========== 期号信息栏 ========== -->
<div class="period-bar">
    <div class="period-label">期号：<span id="current-period">26036期</span></div>
</div>

<!-- ========== 比赛列表区域 ========== -->
<!-- 由JavaScript动态渲染比赛数据 -->
<div id="match-list" class="match-list"></div>

<!-- ========== 底部投注栏 ========== -->
<div class="bottom-bar">
    <!-- 投注统计信息 -->
    <div class="bet-info">
        <div class="bet-stats">
            <div class="bet-amount">已选 <span id="match-count">0</span> 场</div>
            <div class="bet-tip" id="bet-tip">至少选择3场比赛</div>
        </div>
        <div class="bet-actions">
            <button class="clear-btn" id="clear-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                清空
            </button>
        </div>
    </div>
    <!-- 投注额外选项：过关方式、倍数等 -->
    <div class="bet-extra" id="bet-extra">
        <div class="bet-extra-top">
            <div class="bet-extra-title">过关方式</div>
            <div class="bonus">预计奖金：<span id="bonus-amount">0.00</span> 元</div>
        </div>
        <!-- 过关方式选项，由JavaScript动态生成 -->
        <div class="pass-options" id="pass-options"></div>
        <!-- 投注统计 -->
        <div class="bet-summary">
            <div class="bet-summary-item"><span class="label">投注注数：</span><span id="bet-count">0</span> 注</div>
            <div class="bet-summary-item"><span class="label">投注金额：</span><span id="bet-money">0</span> 元</div>
        </div>
        <!-- 倍数选择 -->
        <div class="times-row">
            <div class="times-label">投注倍数</div>
            <div class="times-control">
                <button class="times-btn" id="times-minus">-</button>
                <input type="number" class="times-input" id="times-input" value="1" min="1" max="99">
                <button class="times-btn" id="times-plus">+</button>
            </div>
        </div>
        <button class="submit-btn" id="submit-btn" disabled>确认选号</button>
    </div>
</div>

<script>
/* ========== 批量更新器类 ========== */
/**
 * 批量更新器类：用于合并多个DOM更新请求，减少重绘次数
 * 使用requestAnimationFrame在下一帧统一执行更新
 */
class BatchUpdater {
    constructor() {
        this.pending = false;    // 是否有待处理的更新
        this.updates = [];       // 待执行的更新函数队列
    }
    
    /**
     * 添加更新任务
     * @param {Function} updateFn - 更新函数
     */
    add(updateFn) {
        this.updates.push(updateFn);
        // 如果没有待处理的更新，则调度一次批量更新
        if (!this.pending) {
            this.pending = true;
            requestAnimationFrame(() => this.flush());
        }
    }
    
    /**
     * 执行所有待处理的更新
     */
    flush() {
        const updates = this.updates;
        this.updates = [];
        this.pending = false;
        updates.forEach(fn => fn());
    }
}

/* ========== DOM缓存函数 ========== */
/**
 * 获取缓存的DOM元素
 * 避免重复调用getElementById，提升性能
 * @param {string} id - 元素ID
 * @returns {HTMLElement} DOM元素
 */
function getCachedElement(id) {
    if (!domCache.has(id)) {
        domCache.set(id, document.getElementById(id));
    }
    return domCache.get(id);
}

/* ========== 获取比赛数据 ========== */
/**
 * 根据比赛ID获取比赛数据
 * @param {string|number} id - 比赛ID
 * @returns {Object|undefined} 比赛数据对象
 */
function getMatch(id) {
    return matchDataMap.get(String(id));
}

/* ========== 常量定义 ========== */
const MAX_MATCHES = 15;  // 最大可选择比赛场次数

/* ========== 奖金上限配置 ========== */
// 不同串关方式对应的奖金上限（元）
const bonusLimits = {
    3: 200000,   // 3串1奖金上限20万
    4: 500000,   // 4串1奖金上限50万
    5: 500000,   // 5串1奖金上限50万
    6: 1000000,  // 6串1及以上奖金上限100万
    7: 1000000,
    8: 1000000,
    9: 1000000,
    10: 1000000,
    11: 1000000,
    12: 1000000,
    13: 1000000,
    14: 1000000,
    15: 1000000
};

/* ========== 变量定义 ========== */
const matchData = [];           // 比赛数据数组，存储所有比赛信息
const matchDataMap = new Map(); // 比赛数据Map，用于快速查找，key为比赛ID
const selections = {};          // 用户选择，key为比赛ID，value为{selections: ['home'|'away']}
const domCache = new Map();     // DOM元素缓存，避免重复查询
const batchUpdater = new BatchUpdater();  // 批量更新器实例
let currentPassType = 0;        // 当前选中的过关方式索引
let times = 1;                  // 投注倍数，默认1倍
let updateInterval = null;      // 数据更新定时器

/* ========== 获取过关方式选项 ========== */
/**
 * 根据已选比赛场次数生成过关方式选项
 * @param {number} matchCount - 已选比赛场次数
 * @returns {Array} 过关方式选项数组，如[{label:'3串1',value:3},...]
 */
function getPassOptions(matchCount) {
    const options = [];
    // 从3串1开始，直到已选场次或最大场次
    for (let i = 3; i <= Math.min(matchCount, MAX_MATCHES); i++) {
        options.push({ label: i + '串1', value: i });
    }
    return options;
}

/* ========== 获取已选比赛场次数 ========== */
/**
 * 统计用户已选择的比赛场次数
 * @returns {number} 已选比赛场次数
 */
function getSelectedMatchCount() {
    let count = 0;
    for (const id in selections) {
        // 只统计有选择的比赛
        if (selections[id].selections && selections[id].selections.length > 0) count++;
    }
    return count;
}

/* ========== Toast提示消息 ========== */
/**
 * 显示短暂的提示信息
 * @param {string} message - 提示消息内容
 */
function showToast(message) {
    // 移除已存在的toast
    const existing = document.querySelector('.toast-msg');
    if (existing) existing.remove();
    
    // 创建新的toast元素
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = message;
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:fadeInOut 2s forwards;';
    
    // 添加动画样式
    const style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}';
    document.head.appendChild(style);
    document.body.appendChild(toast);
    
    // 2秒后自动移除
    setTimeout(() => toast.remove(), 2000);
}

/* ========== 下拉菜单控制 ========== */
function updateTime() {
        const now = new Date();
        document.getElementById('header-time').textContent = now.toLocaleString('zh-CN', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }) + ' 更新';
    }
    
    /* ========== 获取比赛数据 ========== */
/**
 * 从服务器获取比赛数据
 * @returns {Promise<boolean>} 是否获取成功
 */
async function fetchMatchData() {
    try {
        // 添加时间戳防止缓存
        const response = await fetch('data/sggg_data.json?t=' + Date.now());
        if (!response.ok) throw new Error('数据获取失败');
        const data = await response.json();
        
        if (data.matches && data.matches.length > 0) {
            // 清空现有数据
            matchData.length = 0;
            matchDataMap.clear();
            
            // 处理比赛数据
            data.matches.forEach((m, index) => {
                // 确保有ID
                if (!m.id) m.id = m.matchNum || (index + 1).toString();
                matchData.push(m);
                matchDataMap.set(String(m.id), m);
                // 初始化选择状态
                if (!selections[m.id]) selections[m.id] = { selections: [] };
            });
            
            // 更新期号和更新时间
            if (data.period) getCachedElement('current-period').textContent = data.period + '期';
            renderMatches();
            getCachedElement('header-time').textContent = data.updateTime || new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
            return true;
        }
        throw new Error('无比赛数据');
    } catch (error) {
        console.error('获取数据失败:', error);
        // 获取失败时加载模拟数据
        loadMockData();
        renderMatches();
        getCachedElement('header-time').textContent = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}) + ' 更新';
        return false;
    }
}

/* ========== 加载模拟数据 ========== */
/**
 * 当无法获取服务器数据时，生成模拟数据用于测试
 */
function loadMockData() {
    matchData.length = 0;
    matchDataMap.clear();
    
    // 模拟联赛和球队数据
    const leagues = ['K1联赛', 'J1联赛', '英超', '西甲', '德甲', '意甲', '法甲'];
    const teams = ['曼联', '利物浦', '切尔西', '阿森纳', '热刺', '曼城', '皇马', '巴萨', '马竞', '拜仁', '多特', '尤文', '国米', 'AC米兰', '巴黎'];
    const handicaps = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5];
    
    // 生成40场模拟比赛
    for (let i = 0; i < 40; i++) {
        const handicap = handicaps[Math.floor(Math.random() * handicaps.length)];
        const m = {
            id: i + 1,
            matchNum: (i + 1).toString(),
            league: leagues[Math.floor(Math.random() * leagues.length)],
            time: String(10 + Math.floor(Math.random() * 14)).padStart(2, '0') + ':' + String(Math.floor(Math.random() * 60)).padStart(2, '0'),
            home: teams[Math.floor(Math.random() * teams.length)],
            away: teams[Math.floor(Math.random() * teams.length)],
            homeRank: Math.floor(Math.random() * 20) + 1,
            awayRank: Math.floor(Math.random() * 20) + 1,
            handicap: handicap,
            homeOdds: (Math.random() * 2 + 1.3).toFixed(2),
            awayOdds: (Math.random() * 2 + 1.3).toFixed(2)
        };
        matchData.push(m);
        matchDataMap.set(String(m.id), m);
        if (!selections[m.id]) selections[m.id] = { selections: [] };
    }
}

/* ========== 格式化赔率 ========== */
/**
 * 将赔率格式化为两位小数
 * @param {number|string} value - 赔率值
 * @returns {string} 格式化后的赔率字符串
 */
function formatOdd(value) {
    return parseFloat(value).toFixed(2);
}

/* ========== 渲染比赛列表 ========== */
/**
 * 渲染所有比赛到页面
 */
function renderMatches() {
    const container = document.getElementById('match-list');
    if (matchData.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
        return;
    }
    let html = '<div class="match-section">';
    matchData.forEach(m => { html += renderMatchItem(m); });
    html += '</div>';
    container.innerHTML = html;
}

/* ========== 渲染单场比赛 ========== */
/**
 * 渲染单场比赛的HTML
 * @param {Object} m - 比赛数据对象
 * @returns {string} 比赛项的HTML字符串
 */
function renderMatchItem(m) {
    const matchIdStr = String(m.id);
    // 初始化选择状态
    if (!selections[matchIdStr]) selections[matchIdStr] = { selections: [] };
    const sel = selections[matchIdStr].selections || [];
    
    // 确定比赛类型和样式类
    const matchType = m.matchType || '足球';
    const matchTypeClass = matchType === '篮球' ? 'basketball' : (matchType === '冰球' ? 'icehockey' : 'football');
    const matchTypeLabel = matchType;
    
    // 生成盘口显示文本
    const handicapText = m.handicap > 0 ? '+' + m.handicap : (m.handicap < 0 ? m.handicap : '');
    
    // 根据比赛类型生成不同的赔率标签
    let homeLabel = '主胜';
    let awayLabel = '客胜';
    
    if (matchType === '篮球') {
        // 篮球：显示让分信息
        homeLabel = m.handicap < 0 ? '主胜(' + m.handicap + ')' : (m.handicap > 0 ? '主胜(+' + m.handicap + ')' : '主胜');
        awayLabel = m.handicap > 0 ? '客胜(' + (-m.handicap) + ')' : (m.handicap < 0 ? '客胜(+' + (-m.handicap) + ')' : '客胜');
    } else if (matchType === '冰球') {
        // 冰球：显示让球信息
        homeLabel = m.handicap !== 0 ? '主胜(' + (m.handicap > 0 ? '+' : '') + m.handicap + ')' : '主胜';
        awayLabel = m.handicap !== 0 ? '客胜' + (m.handicap > 0 ? '(' + (-m.handicap) + ')' : '(+' + (-m.handicap) + ')') : '客胜';
    } else {
        // 足球：显示让球信息
        homeLabel = m.handicap < 0 ? '主胜(' + m.handicap + ')' : (m.handicap > 0 ? '主胜(+' + m.handicap + ')' : '主胜');
        awayLabel = m.handicap > 0 ? '客胜(' + (-m.handicap) + ')' : (m.handicap < 0 ? '客胜(+' + (-m.handicap) + ')' : '客胜');
    }
    
    // 检查选中状态
    const homeSelected = sel.includes('home');
    const awaySelected = sel.includes('away');
    const hasSelection = sel.length > 0;
    
    return `
        <div class="match-item ${hasSelection ? 'has-selection' : ''}">
            <div class="match-info">
                <span class="match-num ${matchTypeClass}">${m.matchNum}</span>
                <span class="match-league">${m.league}</span>
                <span class="match-time">${m.time}</span>
                <span class="match-status">销售中</span>
            </div>
            <div class="teams">
                <div class="team home">
                    <div class="team-name">${m.home}</div>
                    ${m.homeRank ? '<div class="team-rank">[' + m.homeRank + ']</div>' : ''}
                </div>
                <div class="vs">VS${handicapText ? '<span class="handicap">' + handicapText + '</span>' : ''}</div>
                <div class="team away">
                    <div class="team-name">${m.away}</div>
                    ${m.awayRank ? '<div class="team-rank">[' + m.awayRank + ']</div>' : ''}
                </div>
            </div>
            <div class="odds-row">
                <div class="odds-item ${homeSelected ? 'selected' : ''}" onclick="toggleOdds(${m.id}, 'home')">
                    <div class="label">${homeLabel}</div>
                    <div class="value">${formatOdd(m.homeOdds)}</div>
                </div>
                <div class="odds-item ${awaySelected ? 'selected' : ''}" onclick="toggleOdds(${m.id}, 'away')">
                    <div class="label">${awayLabel}</div>
                    <div class="value">${formatOdd(m.awayOdds)}</div>
                </div>
            </div>
        </div>`;
}

/* ========== 切换赔率选择 ========== */
/**
 * 切换某场比赛的赔率选择状态
 * @param {number} matchId - 比赛ID
 * @param {string} selection - 选择类型：'home'主胜 或 'away'客胜
 */
function toggleOdds(matchId, selection) {
    const matchIdStr = String(matchId);
    // 初始化选择状态
    if (!selections[matchIdStr]) selections[matchIdStr] = { selections: [] };
    
    const sel = selections[matchIdStr].selections;
    const idx = sel.indexOf(selection);
    const currentMatchCount = getSelectedMatchCount();
    const isThisMatchSelected = sel.length > 0;
    
    if (idx > -1) {
        // 已选中则取消选择
        sel.splice(idx, 1);
    } else {
        // 未选中则添加选择
        // 检查是否超过最大场次数（只对新增场次计数）
        if (!isThisMatchSelected && currentMatchCount >= MAX_MATCHES) {
            showToast('选择场次不能超过' + MAX_MATCHES + '场');
            return;
        }
        sel.push(selection);
    }
    
    // 重新渲染比赛列表和更新底部栏
    renderMatches();
    updateBottomBar();
}

/* ========== 更新底部投注栏 ========== */
/**
 * 根据用户选择更新底部投注栏的显示状态和内容
 */
function updateBottomBar() {
    const matchCount = getSelectedMatchCount();
    const betExtra = getCachedElement('bet-extra');
    const bottomBar = document.querySelector('.bottom-bar');
    const submitBtn = getCachedElement('submit-btn');
    const betTip = getCachedElement('bet-tip');
    
    if (matchCount > 0) {
        // 有选择时显示底部栏
        bottomBar.style.display = 'block';
        setTimeout(() => bottomBar.classList.add('show'), 10);
        getCachedElement('match-count').textContent = matchCount;
        
        // 统计双选场次（同一场比赛选择了主胜和客胜）
        let doubleSelectCount = 0;
        for (const id in selections) {
            if (selections[id].selections && selections[id].selections.length === 2) {
                doubleSelectCount++;
            }
        }
        
        if (matchCount < 3) {
            // 未达到最小场次
            betExtra.classList.remove('show');
            betTip.textContent = '还需选择' + (3 - matchCount) + '场（可选双选）';
            betTip.style.color = 'var(--warning)';
            submitBtn.disabled = true;
        } else if (matchCount > MAX_MATCHES) {
            // 超过最大场次
            betExtra.classList.remove('show');
            betTip.textContent = '已超过' + MAX_MATCHES + '场上限';
            betTip.style.color = 'var(--danger)';
            submitBtn.disabled = true;
        } else {
            // 有效选择，显示过关方式选项
            betExtra.classList.add('show');
            if (doubleSelectCount > 0) {
                betTip.textContent = '已选' + matchCount + '场（含' + doubleSelectCount + '场双选）';
            } else {
                betTip.textContent = '已选' + matchCount + '场，可双选增加中奖率';
            }
            betTip.style.color = 'var(--success)';
            submitBtn.disabled = false;
            
            // 渲染过关方式选项
            const passOptions = getPassOptions(matchCount);
            if (currentPassType >= passOptions.length) currentPassType = 0;
            renderPassOptions(matchCount, passOptions);
            
            // 计算注数和奖金
            const { totalBets, totalBonus } = calculateBonus(matchCount);
            getCachedElement('bet-count').textContent = totalBets;
            getCachedElement('bet-money').textContent = (totalBets * 2 * times).toFixed(0);
            getCachedElement('bonus-amount').textContent = totalBonus.toFixed(2);
        }
    } else {
        // 无选择时隐藏底部栏
        bottomBar.classList.remove('show');
        setTimeout(() => {
            if (!bottomBar.classList.contains('show')) bottomBar.style.display = 'none';
        }, 300);
        betExtra.classList.remove('show');
        currentPassType = 0;
    }
}

/* ========== 渲染过关方式选项 ========== */
/**
 * 渲染过关方式按钮组
 * @param {number} matchCount - 已选比赛场次数
 * @param {Array} passOptions - 过关方式选项数组
 */
function renderPassOptions(matchCount, passOptions) {
    const container = getCachedElement('pass-options');
    let html = '';
    passOptions.forEach((opt, idx) => {
        html += '<button class="pass-option ' + (currentPassType === idx ? 'selected' : '') + '" onclick="selectPass(' + idx + ')">' + opt.label + '</button>';
    });
    container.innerHTML = html;
}

/* ========== 选择过关方式 ========== */
/**
 * 选择过关方式
 * @param {number} idx - 过关方式索引
 */
function selectPass(idx) {
    currentPassType = idx;
    updateBottomBar();
}

/* ========== 计算奖金 ========== */
/**
 * 计算投注注数和预计奖金
 * @param {number} matchCount - 已选比赛场次数
 * @returns {Object} {totalBets: 总注数, totalBonus: 总奖金}
 */
function calculateBonus(matchCount) {
    const passOptions = getPassOptions(matchCount);
    if (currentPassType >= passOptions.length) return { totalBets: 0, totalBonus: 0 };
    
    const passValue = passOptions[currentPassType].value;  // 串关数，如3表示3串1
    
    // 收集已选比赛的信息
    const selectedMatches = [];
    for (const id in selections) {
        const sel = selections[id].selections;
        if (sel && sel.length > 0) {
            const m = getMatch(id);
            if (m) {
                // 将选择转换为赔率信息
                const options = sel.map(s => ({
                    type: s,
                    odds: s === 'home' ? parseFloat(m.homeOdds) : parseFloat(m.awayOdds)
                }));
                selectedMatches.push({ matchId: id, options });
            }
        }
    }
    
    // 检查场次是否足够
    if (selectedMatches.length < passValue) return { totalBets: 0, totalBonus: 0 };
    
    // 获取所有比赛组合（如选了5场打3串1，则C(5,3)=10种组合）
    const matchCombos = getCombinations(selectedMatches, passValue);
    let totalBets = 0;
    let totalBonus = 0;
    
    // 遍历每种比赛组合，计算注数和奖金
    matchCombos.forEach(matchCombo => {
        // 生成该组合的所有投注方式（考虑双选）
        const betCombos = generateBetCombinations(matchCombo);
        totalBets += betCombos.length;
        
        // 计算每种投注方式的奖金
        betCombos.forEach(betCombo => {
            // 赔率相乘
            let product = betCombo.reduce((acc, opt) => acc * opt.odds, 1);
            let bonus = product * 2 * times;  // 奖金 = 赔率乘积 × 2元 × 倍数
            // 应用奖金上限
            const limit = bonusLimits[passValue] || 1000000;
            if (bonus > limit) bonus = limit;
            totalBonus += bonus;
        });
    });
    
    return { totalBets, totalBonus };
}

/* ========== 生成投注组合 ========== */
/**
 * 生成一组比赛的所有投注组合（处理双选情况）
 * @param {Array} matchCombo - 比赛组合数组
 * @returns {Array} 所有投注组合数组
 */
function generateBetCombinations(matchCombo) {
    const result = [[]];
    // 遍历每场比赛
    for (const match of matchCombo) {
        const newResult = [];
        // 将该场比赛的每个选项与已有组合配对
        for (const existing of result) {
            for (const opt of match.options) {
                newResult.push([...existing, opt]);
            }
        }
        result.length = 0;
        result.push(...newResult);
    }
    return result;
}

/* ========== 获取组合 ========== */
/**
 * 从数组中获取指定大小的所有组合（排列组合中的组合）
 * @param {Array} arr - 源数组
 * @param {number} size - 组合大小
 * @returns {Array} 所有组合的数组
 */
function getCombinations(arr, size) {
    const result = [];
    /**
     * 递归生成组合
     * @param {number} start - 起始索引
     * @param {Array} combo - 当前组合
     */
    function combine(start, combo) {
        if (combo.length === size) {
            result.push([...combo]);
            return;
        }
        for (let i = start; i < arr.length; i++) {
            combo.push(arr[i]);
            combine(i + 1, combo);
            combo.pop();  // 回溯
        }
    }
    combine(0, []);
    return result;
}

/* ========== 提交投注 ========== */
/**
 * 确认投注，显示投注信息并重置选择
 */
function submitBet() {
    const matchCount = getSelectedMatchCount();
    const passOptions = getPassOptions(matchCount);
    const passLabel = passOptions[currentPassType]?.label || '';
    const { totalBets, totalBonus } = calculateBonus(matchCount);
    const totalMoney = totalBets * 2 * times;
    
    // 统计双选场次
    let doubleCount = 0;
    for (const id in selections) {
        if (selections[id].selections && selections[id].selections.length === 2) doubleCount++;
    }
    
    // 构建确认消息
    let confirmMsg = '投注确认\n\n';
    confirmMsg += '过关方式：' + passLabel + '\n';
    confirmMsg += '已选场次：' + matchCount + ' 场';
    if (doubleCount > 0) confirmMsg += '（含' + doubleCount + '场双选）';
    confirmMsg += '\n投注注数：' + totalBets + ' 注\n';
    confirmMsg += '投注倍数：' + times + ' 倍\n';
    confirmMsg += '投注金额：' + totalMoney + ' 元\n';
    confirmMsg += '预计奖金：' + totalBonus.toFixed(2) + ' 元\n\n';
    confirmMsg += '是否确认投注？';
    
    if (confirm(confirmMsg)) {
        alert('投注成功！\n\n' + passLabel + ' - 共 ' + totalBets + ' 注，' + totalMoney + ' 元');
        // 重置选择状态
        for (const id in selections) selections[id] = { selections: [] };
        times = 1;
        currentPassType = 0;
        document.getElementById('times-input').value = 1;
        renderMatches();
        updateBottomBar();
    }
}

/* ========== 初始化函数 ========== */
/**
 * 页面加载完成后执行初始化
 */
async function init() {
        updateTime();
        document.getElementById('match-list').innerHTML = '<div class="match-section">' + Array(5).fill('<div class="match-skeleton"><div class="match-skeleton-info"><div class="skeleton" style="width:40px;height:18px;"></div><div class="skeleton" style="width:60px;height:14px;"></div></div><div class="match-skeleton-teams"><div class="skeleton match-skeleton-team"></div><div class="skeleton match-skeleton-vs"></div><div class="skeleton match-skeleton-team"></div></div><div class="match-skeleton-odds"><div class="skeleton match-skeleton-odd"></div><div class="skeleton match-skeleton-odd"></div></div></div>').join('') + '</div>';
    
    await fetchMatchData();
    
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(() => { fetchMatchData(); updateTime(); }, 120000);
}

/* ========== 启动初始化 ========== */
init();

/* ========== 倍数减少按钮 ========== */
// 减少投注倍数
document.getElementById('times-minus').addEventListener('click', () => {
    if (times > 1) {
        times--;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

/* ========== 倍数增加按钮 ========== */
// 增加投注倍数
document.getElementById('times-plus').addEventListener('click', () => {
    if (times < 99) {
        times++;
        document.getElementById('times-input').value = times;
        updateBottomBar();
    }
});

/* ========== 倍数输入框变化 ========== */
// 处理倍数输入框的值变化
document.getElementById('times-input').addEventListener('change', (e) => {
    let val = parseInt(e.target.value) || 1;
    // 限制在1-99之间
    if (val < 1) val = 1;
    if (val > 99) val = 99;
    times = val;
    e.target.value = times;
    updateBottomBar();
});

/* ========== 清空按钮 ========== */
// 清空所有选择
document.getElementById('clear-btn').addEventListener('click', () => {
    for (const id in selections) selections[id] = { selections: [] };
    times = 1;
    currentPassType = 0;
    document.getElementById('times-input').value = 1;
    renderMatches();
    updateBottomBar();
});

/* ========== 确认投注按钮 ========== */
document.getElementById('submit-btn').addEventListener('click', submitBet);
</script>
