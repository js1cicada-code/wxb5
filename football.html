<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞彩足球选号</title>
    <style>
        :root {
            --primary: #d43c33;
            --primary-dark: #b8342c;
            --primary-light: #ff4d42;
            --secondary: #ff6b5b;
            --accent: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-main: #f5f5f5;
            --bg-card: #ffffff;
            --bg-elevated: #fafafa;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-light: #f0f0f0;
            --border-medium: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
            --transition-slow: 300ms ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: auto; min-height: 100vh; overflow-y: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 0 12px; height: 54px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
        .header-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .header-content { flex: 1; text-align: center; }
        .header h1 { color: #fff; font-size: 17px; font-weight: 600; line-height: 1.2; }
        .header-time { color: rgba(255,255,255,0.85); font-size: 11px; margin-top: 2px; }
        
        .match-section { background: var(--bg-card); margin-bottom: 10px; border-radius: var(--radius-md); margin: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .match-item { padding: 10px 12px; border-bottom: 1px solid var(--border-light); transition: background var(--transition-fast); }
        .match-item:last-child { border-bottom: none; }
        .match-item:active { background: var(--bg-elevated); }
        .match-info { display: flex; align-items: center; margin-bottom: 6px; justify-content: space-between; }
        .match-info-left { display: flex; align-items: center; }
        .match-num { padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; }
        .match-num.day-1 { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .match-num.day-2 { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .match-num.day-3 { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); }
        .match-num.day-4 { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .match-num.day-5 { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); }
        .match-num.day-6 { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .match-num.day-7 { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .match-league { font-size: 11px; color: var(--primary); font-weight: 600; margin-right: 6px; }
        .match-time { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
        .match-status { font-size: 9px; color: var(--warning); background: #fffbeb; padding: 2px 6px; border-radius: var(--radius-sm); font-weight: 500; }
        .match-status.closed { color: var(--text-muted); background: var(--bg-elevated); }
        
        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .team { flex: 1; text-align: center; }
        .team.home { text-align: right; padding-right: 10px; }
        .team.away { text-align: left; padding-left: 10px; }
        .team-name { font-size: 13px; color: var(--text-primary); font-weight: 600; }
        .team-name .rank { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .analysis-btn { font-size: 10px; color: #fff; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 1px 5px; border-radius: 3px; cursor: pointer; font-weight: 500; white-space: nowrap; }
        .analysis-btn:active { transform: scale(0.95); }
        .team-rank { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .vs { font-size: 11px; color: var(--text-muted); padding: 0 8px; font-weight: 500; }
        
        .odds-row { display: flex; gap: 6px; }
        .odds-row.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 6px; margin: 4px 0; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); box-shadow: 0 2px 4px rgba(212, 60, 51, 0.1); }
        .odds-item { flex: 1; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); padding: 6px 4px; text-align: center; cursor: pointer; transition: all var(--transition-normal); position: relative; overflow: hidden; }
        .odds-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--primary); opacity: 0; transition: opacity var(--transition-fast); }
        .odds-item:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .odds-item:active { transform: translateY(0) scale(0.98); }
        .odds-item.selected { background: linear-gradient(135deg, #fff1f0 0%, #ffe4e1 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212, 60, 51, 0.15); }
        .odds-item.selected::before { opacity: 0.03; }
        .odds-item.disabled { background: var(--bg-main); cursor: not-allowed; opacity: 0.6; }
        .odds-item .label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
        .odds-item .value { font-size: 14px; color: var(--text-primary); font-weight: 700; }
        .odds-item .trend-inline { display: inline-flex; align-items: center; margin-left: 2px; }
        .odds-item .trend-inline svg { width: 10px; height: 10px; }
        .trend-up { color: var(--danger); }
        .trend-down { color: var(--success); }
        
        .rqspf-label { font-size: 11px; color: var(--warning); margin-bottom: 4px; font-weight: 500; }
        
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); padding: 12px 12px; display: none; transform: translateY(100%); transition: transform var(--transition-slow); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .bottom-bar.show { display: block; transform: translateY(0); }
        .bet-info { display: flex; align-items: center; justify-content: space-between; }
        .bet-stats { display: flex; flex-direction: column; gap: 2px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .bet-tip { font-size: 11px; color: var(--text-muted); }
        .clear-btn { font-size: 12px; color: var(--text-secondary); cursor: pointer; padding: 8px 12px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); display: flex; align-items: center; gap: 4px; transition: all var(--transition-fast); font-weight: 500; }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
        .clear-btn:active { background: var(--bg-elevated); }
        .clear-btn svg { width: 14px; height: 14px; }
        .bet-amount { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bet-amount span { color: var(--primary); font-weight: 700; }
        .bet-extra { display: none; padding-top: 12px; border-top: 1px solid var(--border-light); margin-top: 10px; }
        .bet-extra.show { display: block; }
        .bet-extra-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .bet-extra-title { font-size: 15px; color: var(--text-primary); font-weight: 600; }
        .bonus { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .bonus span { color: var(--primary); font-weight: 700; font-size: 16px; }
        .pass-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .pass-option { padding: 8px 14px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); font-size: 14px; color: var(--text-secondary); cursor: pointer; background: var(--bg-card); transition: all var(--transition-fast); font-weight: 500; }
        .pass-option:hover { border-color: var(--primary); color: var(--primary); }
        .pass-option.selected { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(212, 60, 51, 0.3); }
        .pass-option:disabled { background: var(--bg-elevated); color: var(--text-muted); border-color: var(--border-light); cursor: not-allowed; opacity: 0.6; }
        .bet-summary { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
        .bet-summary-item .label { color: var(--text-secondary); }
        .bet-summary-item span:not(.label) { color: var(--primary); font-weight: 700; }
        .times-row { display: flex; align-items: center; justify-content: space-between; }
        .times-label { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .times-control { display: flex; align-items: center; gap: 10px; }
        .times-btn { width: 32px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--text-secondary); font-weight: 600; line-height: 30px; text-align: center; transition: all var(--transition-fast); }
        .times-btn:hover { border-color: var(--primary); color: var(--primary); }
        .times-btn:active { background: var(--bg-elevated); transform: scale(0.95); }
        .times-input { width: 56px; height: 32px; border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-primary); background: var(--bg-card); transition: border-color var(--transition-fast); }
        .times-input:focus { border-color: var(--primary); outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 2px 8px rgba(212, 60, 51, 0.3); margin-top: 12px; }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212, 60, 51, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; opacity: 0; transition: opacity var(--transition-normal); backdrop-filter: blur(2px); }
        .modal.show { display: flex; align-items: flex-end; opacity: 1; }
        .modal-content { background: var(--bg-card); width: 100%; max-height: 80vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; transform: translateY(100%); transition: transform var(--transition-slow) cubic-bezier(0.16, 1, 0.3, 1); }
        .modal.show .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-light); background: var(--bg-card); }
        .modal-header h3 { font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .modal-header .close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .modal-header .close:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .modal-body { padding: 16px; max-height: 60vh; overflow-y: auto; }
        
        .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .score-grid.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 8px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); }
        .score-item { padding: 8px 4px; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; font-size: 11px; cursor: pointer; transition: all var(--transition-fast); }
        .score-item:hover { border-color: var(--primary); transform: translateY(-1px); }
        .score-item.selected { background: linear-gradient(135deg, #fff1f0 0%, #ffe4e1 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212, 60, 51, 0.15); }
        .score-item .score { font-weight: 700; color: var(--text-primary); }
        .score-item .odd { color: var(--primary); font-weight: 500; }
        .score-item .trend-inline { display: inline-flex; align-items: center; margin-left: 2px; }
        .score-item .trend-inline svg { width: 10px; height: 10px; }
        
        .bqc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .bqc-grid.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 8px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); }
        .bqc-item { padding: 8px 4px; background: var(--bg-elevated); border: 1.5px solid var(--border-medium); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: all var(--transition-fast); }
        .bqc-item:hover { border-color: var(--primary); transform: translateY(-1px); }
        .bqc-item.selected { background: linear-gradient(135deg, #fff1f0 0%, #ffe4e1 100%); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212, 60, 51, 0.15); }
        .bqc-item .trend-inline { display: inline-flex; align-items: center; margin-left: 2px; }
        .bqc-item .trend-inline svg { width: 10px; height: 10px; }
        
        .zjq-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .zjq-grid.single-pass { border: 1.5px solid var(--primary-light); border-radius: var(--radius-md); padding: 8px; background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); }
        
        .more-plays-tabs { display: flex; gap: 8px; padding: 12px 12px 0; }
        .more-plays-tab { flex: 1; padding: 8px; font-size: 12px; color: var(--text-secondary); text-align: center; cursor: pointer; border-radius: var(--radius-sm); position: relative; transition: all var(--transition-fast); font-weight: 500; background: var(--bg-elevated); border: 1px solid var(--border-light); }
        .more-plays-tab:hover { border-color: var(--border-medium); }
        .more-plays-tab.active { color: var(--text-primary); background: var(--bg-card); border-color: var(--border-medium); font-weight: 600; }
        .more-plays-tab sup { position: absolute; top: -4px; right: -4px; background: var(--text-muted); color: #fff; font-size: 8px; padding: 0 4px; border-radius: 8px; min-width: 12px; text-align: center; line-height: 12px; font-weight: 600; }
        .more-plays-tab.active sup { background: var(--primary); }
        .more-plays-body { padding: 12px; }
        
        .more-plays-btn { display: flex; align-items: center; justify-content: center; padding: 8px 12px; color: var(--text-secondary); font-size: 11px; cursor: pointer; background: var(--bg-card); border-radius: var(--radius-md); margin-top: 8px; transition: all var(--transition-fast); font-weight: 500; border: 1px solid var(--border-light); }
        .more-plays-btn:hover { background: var(--bg-elevated); border-color: var(--border-medium); }
        .more-plays-btn .arrow { margin-left: 4px; font-size: 10px; }
        .more-plays-btn sup { background: var(--text-muted); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 8px; margin-left: 6px; font-weight: 600; }
        
        .play-type-label { font-size: 11px; color: var(--primary); margin: 6px 0 4px; padding-left: 5px; font-weight: 600; border-left: 3px solid var(--primary); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-light); background: var(--bg-card); }
        .modal-header h3 { font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .modal-header .close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .modal-header .close:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .modal-body { padding: 16px; max-height: 60vh; overflow-y: auto; }
        
        .skeleton { background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-main) 50%, var(--bg-elevated) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s ease-in-out infinite; border-radius: var(--radius-sm); }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .match-skeleton { padding: 12px; border-bottom: 1px solid var(--border-light); }
        .match-skeleton-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .match-skeleton-teams { display: flex; justify-content: space-between; align-items: center; }
        .match-skeleton-team { width: 35%; height: 16px; }
        .match-skeleton-vs { width: 30px; height: 12px; }
        .match-skeleton-odds { display: flex; gap: 8px; margin-top: 10px; }
        .match-skeleton-odd { flex: 1; height: 40px; }
        
        .match-list { }
        
        @media (min-width: 768px) {
            body {
                background: #f0f2f5;
                min-height: 100vh;
            }
            
            .header {
                max-width: 1200px;
                margin: 16px auto 0;
                border-radius: 0;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }
            
            .tabs {
                max-width: 1200px;
                margin: 0 auto;
                border-radius: 0;
                box-shadow: 0 1px 4px rgba(0,0,0,0.05);
                background: #fff;
            }
            
            .match-list {
                max-width: 1200px;
                margin: 0 auto;
                padding: 12px;
            }
            
            .match-section {
                display: block;
                margin: 0;
                background: #fff;
                border-radius: 4px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.05);
                overflow: hidden;
            }
            
            .match-item {
                padding: 14px 16px;
                border-bottom: 1px solid #f0f0f0;
                border-radius: 0;
                transition: background 0.15s ease;
                cursor: default;
                display: grid;
                grid-template-columns: 80px 70px 1fr auto 1fr;
                gap: 12px;
                align-items: center;
            }
            
            .match-item:hover {
                background: #fafafa;
                transform: none;
                box-shadow: none;
            }
            
            .match-item:last-child {
                border-bottom: none;
            }
            
            .match-info {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 0;
                gap: 4px;
            }
            
            .match-info-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            
            .match-num {
                font-size: 12px;
                padding: 2px 6px;
            }
            
            .match-league {
                font-size: 11px;
            }
            
            .match-time {
                font-size: 12px;
                color: #666;
            }
            
            .match-status {
                display: none;
            }
            
            .teams {
                margin-bottom: 0;
            }
            
            .team.home {
                text-align: right;
                padding-right: 0;
            }
            
            .team.away {
                text-align: left;
                padding-left: 0;
            }
            
            .team-name {
                font-size: 14px;
                font-weight: 600;
            }
            
            .team-rank {
                display: none;
            }
            
            .vs {
                font-size: 12px;
                padding: 0;
            }
            
            .analysis-btn {
                display: none;
            }
            
            .odds-row {
                gap: 4px;
            }
            
            .odds-item {
                padding: 6px 8px;
                border-radius: 2px;
            }
            
            .odds-item:hover {
                transform: none;
                box-shadow: none;
            }
            
            .odds-item.selected {
                background: #fff1f0;
                border-color: #ff4d4f;
            }
            
            .play-type-label {
                display: none;
            }
            
            .more-plays-btn {
                margin-top: 4px;
            }
            
            .tab:hover {
                background: transparent;
                color: var(--primary);
            }
            
            .bottom-bar {
                max-width: 1200px;
                left: 50%;
                transform: translateX(-50%) translateY(100%);
                margin: 0;
                border-radius: 4px 4px 0 0;
                box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
            }
            
            .bottom-bar.show {
                transform: translateX(-50%) translateY(0);
            }
            
            .modal.show {
                align-items: center;
                justify-content: center;
            }
            
            .modal-content {
                max-width: 500px;
                max-height: 80vh;
                border-radius: var(--radius-lg);
                transform: translateY(0) scale(0.95);
            }
            
            .modal.show .modal-content {
                transform: translateY(0) scale(1);
            }
            
            .header-dropdown-item:hover {
                background: #f5f5f5;
            }
            
            .score-item:hover, .bqc-item:hover {
                transform: none;
            }
            
            .submit-btn:hover {
                transform: none;
                opacity: 0.9;
            }
            
            .more-plays-btn:hover {
                transform: none;
                background: #f5f5f5;
            }
        }
        
        @media (min-width: 1024px) {
            .match-item {
                grid-template-columns: 90px 80px 1fr auto 1fr;
                gap: 16px;
            }
            
            .team-name {
                font-size: 15px;
            }
            
            body {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-back" onclick="window.location.href='index.html'"></div>
    <div class="header-content">
        <h1>竞彩足球</h1>
        <div class="header-time" id="header-time"></div>
    </div>
</div>

<div id="match-list" class="match-list"></div>
    
    <div class="bottom-bar">
        <div class="bet-info">
            <div class="bet-stats">
                <div class="bet-amount" id="amount-wrapper">已选 <span id="match-count">0</span> 场</div>

    <script>
        class BatchUpdater {
            constructor() {
                this.pending = false;
                this.updates = [];
            }
            add(updateFn) {
                this.updates.push(updateFn);
                if (!this.pending) {
                    this.pending = true;
                    requestAnimationFrame(() => this.flush());
                }
            }
            flush() {
                const updates = this.updates;
                this.updates = [];
                this.pending = false;
                updates.forEach(fn => fn());
            }
        }
        
        function getCachedElement(id) {
            if (!domCache.has(id)) {
                domCache.set(id, document.getElementById(id));

            return domCache.get(id);

        function isSinglePassAvailable(matchId, playType) {
            const status = singlePassStatus[matchId];
            if (!status) return false;
            const poolCode = sportConfig[currentSport].poolCodeMap[playType];
            return status[poolCode] && status[poolCode].singlePass;
        }
        
        function getSinglePassLabel(matchId, playType) {
            if (isSinglePassAvailable(matchId, playType)) {

        function updateTime() {

        async function fetchFixtureMapping() {
            try {
                const response = await fetch('data/fixture_mapping.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.mapping) {
                        Object.assign(fixtureMapping, data.mapping);
                        console.log('已加载fixtureId映射:', Object.keys(fixtureMapping).length, '场');
                    }
                }
            } catch (e) {
                console.log('加载fixtureId映射失败:', e);
            }
        }
        
        function getFixtureId(homeName, awayName) {
            const key1 = `${homeName}_${awayName}`;
            if (fixtureMapping[key1]) {
                console.log('精确匹配:', key1, '->', fixtureMapping[key1].fixtureId);
                return fixtureMapping[key1].fixtureId;
            }
            for (const key in fixtureMapping) {
                if (key.includes(homeName.substring(0, 3)) && key.includes(awayName.substring(0, 3))) {
                    console.log('模糊匹配:', homeName, awayName, '->', key, fixtureMapping[key].fixtureId);
                    return fixtureMapping[key].fixtureId;
                }
            }
            console.log('未匹配:', homeName, awayName);
            return null;
        }
        
        function openAnalysis(matchId) {
            console.log('openAnalysis called with matchId:', matchId);
            const match = matchDataMap.get(String(matchId)) || matchDataMap.get(parseInt(matchId));

                console.log('match not found in matchDataMap');
                alert('未找到比赛数据');
                return;
            }
            console.log('match found:', match.home, 'vs', match.away);
            
            let fixtureId = match.fixtureId;
            if (!fixtureId && fixtureMapping.byMatchId) {
                const mapping = fixtureMapping.byMatchId[String(matchId)] || fixtureMapping.byMatchId[parseInt(matchId)];
                if (mapping) {
                    fixtureId = mapping.fixtureId;
                    console.log('got fixtureId from byMatchId:', fixtureId);
                }

            if (!fixtureId) {
                fixtureId = getFixtureId(match.home, match.away);

            window.location.href = url;

        async function fetchSinglePassStatus() {
            const url = currentSport === 'football' 
                ? 'https://webapi.sporttery.cn/gateway/uniform/football/getMatchListV1.qry?clientCode=3001'
                : 'https://webapi.sporttery.cn/gateway/uniform/basketball/getMatchListV1.qry?clientCode=3001';
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'Referer': currentSport === 'football' 
                            ? 'https://www.sporttery.cn/jc/zqszsc/'
                            : 'https://www.sporttery.cn/jc/lqszsc/'
                    }
                });
                const data = await response.json();
                
                if (data.success && data.value && data.value.matchInfoList) {
                    data.value.matchInfoList.forEach(dayMatch => {
                        if (dayMatch.subMatchList) {
                            dayMatch.subMatchList.forEach(match => {
                                const matchId = match.matchId;
                                if (match.poolList) {
                                    singlePassStatus[matchId] = {};
                                    match.poolList.forEach(pool => {
                                        const isSinglePass = pool.cbtValue == 1 && pool.cbtSingle == 1;
                                        singlePassStatus[matchId][pool.poolCode] = {
                                            available: pool.cbtValue == 1,
                                            singlePass: isSinglePass
                                        };
                                    });
                                }
                            });
                        }
                    });
                    return true;
                }
                return false;
            } catch (error) {
                console.error('获取数据失败:', error);
                return false;
            }
        }

            try {
                const response = await fetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=1');
                const data = await response.json();
                
                if (data.success && data.value && data.value.matchInfoList) {
                    matchData.length = 0;
                    matchDataMap.clear();
                    
                    data.value.matchInfoList.forEach(dayMatch => {

                                    awayRank: match.awayRank || '',

                                if (match.hhad && match.hhad.h) {

                                if (match.crs) {

                                        parseFloat(match.crs.s04s02) || 0,
                                        parseFloat(match.crs.s05s00) || 0,
                                        parseFloat(match.crs.s05s01) || 0,
                                        parseFloat(match.crs.s05s02) || 0,
                                        parseFloat(match.crs.s00s00) || 0,
                                        parseFloat(match.crs.s01s01) || 0,
                                        parseFloat(match.crs.s02s02) || 0,
                                        parseFloat(match.crs.s03s03) || 0,
                                        parseFloat(match.crs.s00s01) || 0,
                                        parseFloat(match.crs.s00s02) || 0,
                                        parseFloat(match.crs.s01s02) || 0,
                                        parseFloat(match.crs.s00s03) || 0,
                                        parseFloat(match.crs.s01s03) || 0,
                                        parseFloat(match.crs.s02s03) || 0,
                                        parseFloat(match.crs.s00s04) || 0,
                                        parseFloat(match.crs.s01s04) || 0,

                                        parseFloat(match.crs.s01s05) || 0,
                                        parseFloat(match.crs.s02s05) || 0,
                                        parseFloat(match.crs.s1sh) || 0,

                                }
                                
                                if (match.ttg) {

                                        parseFloat(match.ttg.s7) || 0
                                    ];
                                }
                                
                                if (match.hafu) {
                                    item.bqc = [
                                        parseFloat(match.hafu.hh) || 0,
                                        parseFloat(match.hafu.hd) || 0,
                                        parseFloat(match.hafu.ha) || 0,
                                        parseFloat(match.hafu.dh) || 0,
                                        parseFloat(match.hafu.dd) || 0,
                                        parseFloat(match.hafu.da) || 0,
                                        parseFloat(match.hafu.ah) || 0,
                                        parseFloat(match.hafu.ad) || 0,
                                        parseFloat(match.hafu.aa) || 0
                                    ];
                                }
                                
                                const matchNumStr = match.matchNumStr || '';
                                const dayMap = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
                                let matchDayOfWeek = 0;
                                for (const [day, num] of Object.entries(dayMap)) {
                                    if (matchNumStr.startsWith(day)) {
                                        matchDayOfWeek = num;
                                        break;
                                    }
                                }
                                item.dayOfWeek = matchDayOfWeek;
                                
                                matchData.push(item);

                                if (!selections[match.matchId]) {
                                    selections[match.matchId] = { spf: [], rqspf: [], bf: [], zjq: [], bqc: [] };

                    renderMatches();
                    updateTime();
                    return true;
                }
                return false;
            } catch (error) {
                console.error('获取比赛数据失败:', error);
                return false;

        }
        
        function isSellingTime() {
            const now = new Date();
            const day = now.getDay() || 7;
            const hour = now.getHours();
            if (day === 0 || day === 6) {
                return hour >= 11 && hour < 23;
            } else {
                return hour >= 11 && hour < 22;
            }
        }
        
        function getSellingStatus() {
            return isSellingTime() ? '销售中' : '已停售';
        }
        
        function isBeforeSellingTime() {
            const now = new Date();
            const day = now.getDay() || 7;
            const hour = now.getHours();
            if (day === 0 || day === 6) {
                return hour < 11;
            } else {
                return hour < 11;
            }
        }
        
        function isAfterSellingTime() {
            const now = new Date();
            const day = now.getDay() || 7;
            const hour = now.getHours();
            if (day === 0 || day === 6) {
                return hour >= 23;
            } else {
                return hour >= 22;
            }
        }
        
        function getDayClass(matchNumStr) {
            const dayMap = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 7 };
            for (const [day, num] of Object.entries(dayMap)) {
                if (matchNumStr && matchNumStr.startsWith(day)) {
                    return 'day-' + num;
                }
            }
            return 'day-1';
        }
        
        function formatRank(rank) {
            if (!rank) return '';
            // 提取数字，例如 "[英甲17]" -> "[17]"
            const match = rank.match(/\[(.*?)\]/);
            if (match) {
                const parts = match[1].match(/\d+/);
                if (parts) {
                    return '<span class="rank">[' + parts[0] + ']</span>';
                }
            }
            return '';
        }
        
        function getTrendFromApi(matchId, playType, idx) {
            const key = matchId + '_' + playType;
            const trends = oddsTrend[key];
            if (!trends || !trends[idx]) return null;
            return { direction: trends[idx] };
        }
        
        function formatOdd(value) {
            return parseFloat(value).toFixed(2);
        }
        
        function isPlayAvailable(odds) {
            if (!odds) return false;
            if (Array.isArray(odds)) {
                return odds.some(o => o > 0);
            }
            if (odds.odds && Array.isArray(odds.odds)) {
                return odds.odds.some(o => o > 0);
            }
            return false;
        }
        
        function renderOddsWithTrend(value, trend) {
            const formatted = formatOdd(value);
            if (!trend) return '<div class="value">' + formatted + '</div>';
            const arrow = trend.direction === 'up' 
                ? '<span class="trend-inline trend-up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>' 
                : '<span class="trend-inline trend-down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span>';
            return '<div class="value">' + formatted + arrow + '</div>';
        }
        
        function renderMatches() {
            const container = document.getElementById('match-list');
            if (matchData.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
                return;
            }
            
            const todayDayOfWeek = new Date().getDay() || 7;
            
            let filteredMatches;
            if (isSellingTime()) {
                const tomorrow = todayDayOfWeek === 7 ? 1 : todayDayOfWeek + 1;
                filteredMatches = matchData.filter(m => {
                    if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                    return m.dayOfWeek === todayDayOfWeek || m.dayOfWeek === tomorrow;
                });
            } else if (isBeforeSellingTime()) {
                filteredMatches = matchData.filter(m => {
                    if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                    return m.dayOfWeek >= todayDayOfWeek;
                });
            } else {
                const tomorrow = todayDayOfWeek === 7 ? 1 : todayDayOfWeek + 1;
                filteredMatches = matchData.filter(m => {
                    if (!m.dayOfWeek || m.dayOfWeek === 0) return true;
                    return m.dayOfWeek >= tomorrow;
                });
            }
            
            if (filteredMatches.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:14px;">暂无赛事</div>';
                return;
            }
            
            let html = '<div class="match-section">';
            filteredMatches.forEach(m => { html += renderMatchItem(m); });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderSkeleton(count = 5) {
            let html = '<div class="match-section">';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="match-skeleton">
                        <div class="match-skeleton-info">
                            <div class="skeleton" style="width:40px;height:18px;"></div>
                            <div class="skeleton" style="width:60px;height:14px;"></div>
                            <div class="skeleton" style="width:50px;height:14px;"></div>
                        </div>
                        <div class="match-skeleton-teams">
                            <div class="skeleton match-skeleton-team"></div>
                            <div class="skeleton match-skeleton-vs"></div>
                            <div class="skeleton match-skeleton-team"></div>
                        </div>
                        <div class="match-skeleton-odds">
                            <div class="skeleton match-skeleton-odd"></div>
                            <div class="skeleton match-skeleton-odd"></div>
                            <div class="skeleton match-skeleton-odd"></div>
                        </div>
                    </div>`;
            }
            html += '</div>';
            return html;
        }
        
        function renderMatchItem(m) {
            const sel = selections[m.id];
            let oddsHtml = '';
            
            if (currentPlayType === 'mixed') {
                if (m.spf && isPlayAvailable(m.spf)) {
                    const singlePassBadge = getSinglePassLabel(m.id, 'spf');
                    const singlePassClass = isSinglePassAvailable(m.id, 'spf') ? ' single-pass' : '';
                    oddsHtml += '<div class="play-type-label">胜平负' + singlePassBadge + '</div><div class="odds-row' + singlePassClass + '">';
                    for (let i = 0; i < 3; i++) {
                        const trend = getTrendFromApi(m.id, 'spf', i);
                        const labels = ['主胜', '平', '客胜'];
                        oddsHtml += '<div class="odds-item ' + (sel.spf.includes(i) ? 'selected' : '') + '" onclick="toggleOdds(' + m.id + ', \'spf\', ' + i + ')">';
                        oddsHtml += '<div class="label">' + labels[i] + '</div>' + renderOddsWithTrend(m.spf[i], trend) + '</div>';
                    }
                    oddsHtml += '</div>';
                } else if (m.spf) {
                    oddsHtml += '<div class="play-type-label">胜平负</div><div class="odds-row"><div class="odds-item disabled" style="flex:1"><div class="value" style="color:#999">未开售</div></div></div>';
                }
                if (m.rqspf && isPlayAvailable(m.rqspf)) {

                    const sel = selections[id][currentPlayType];
                    if (sel.length > 0) count++;
                }
            }
            return count;

        function hasSinglePassSelection() {
            if (currentPlayType === 'mixed') {
                for (const id in selections) {
                    const sel = selections[id];
                    if (sel.spf.length > 0 && isSinglePassAvailable(parseInt(id), 'spf')) return true;
                    if (sel.rqspf.length > 0 && isSinglePassAvailable(parseInt(id), 'rqspf')) return true;
                    if (sel.bf.length > 0 && isSinglePassAvailable(parseInt(id), 'bf')) return true;
                    if (sel.zjq.length > 0 && isSinglePassAvailable(parseInt(id), 'zjq')) return true;
                    if (sel.bqc.length > 0 && isSinglePassAvailable(parseInt(id), 'bqc')) return true;
                }
            } else {
                for (const id in selections) {
                    const sel = selections[id][currentPlayType];
                    if (sel.length > 0 && isSinglePassAvailable(parseInt(id), currentPlayType)) return true;
                }
            }
            return false;
        }
        
        function updateBottomBar() {
            let matchCount = 0;
            const selectedOdds = [];
            
            if (currentPlayType === 'mixed') {
                for (const id in selections) {
                    const sel = selections[id];
                    const m = getMatch(id);
                    if (!m) continue;
                    let odds = [];
                    if (sel.spf.length > 0 && m.spf) {
                        odds = odds.concat(sel.spf.map(i => m.spf[i]));
                    }
                    if (sel.rqspf.length > 0 && m.rqspf) {
                        odds = odds.concat(sel.rqspf.map(i => m.rqspf.odds[i]));
                    }
                    if (sel.bf.length > 0 && m.bf) {
                        odds = odds.concat(sel.bf.map(i => m.bf[i]));
                    }
                    if (sel.zjq.length > 0 && m.zjq) {
                        odds = odds.concat(sel.zjq.map(i => m.zjq[i]));
                    }
                    if (sel.bqc.length > 0 && m.bqc) {
                        odds = odds.concat(sel.bqc.map(i => m.bqc[i]));
                    }
                    if (odds.length > 0) {
                        matchCount++;
                        selectedOdds.push(odds);
                    }
                }
            } else {
                for (const id in selections) {
                    const sel = selections[id][currentPlayType];
                    if (sel.length > 0) {
                        matchCount++;
                        const m = getMatch(id);
                        if (!m) continue;
                        let odds = [];
                        if (currentPlayType === 'spf') {
                            odds = sel.map(i => m.spf[i]);
                        } else if (currentPlayType === 'rqspf') {
                            odds = sel.map(i => m.rqspf.odds[i]);
                        } else if (currentPlayType === 'bf') {
                            odds = sel.map(i => m.bf[i]);
                        } else if (currentPlayType === 'zjq') {
                            odds = sel.map(i => m.zjq[i]);
                        } else if (currentPlayType === 'bqc') {
                            odds = sel.map(i => m.bqc[i]);
                        }
                        selectedOdds.push(odds);
                    }
                }
            }
            
            const betExtra = document.getElementById('bet-extra');
            const clearBtn = document.getElementById('clear-btn');
            const bottomBar = document.querySelector('.bottom-bar');
            const betTip = document.getElementById('bet-tip');
            const matchCountEl = document.getElementById('match-count');
            
            const hasSinglePass = hasSinglePassSelection();
            
            if (matchCount > 0) {
                bottomBar.style.display = 'block';
                setTimeout(() => bottomBar.classList.add('show'), 10);
                matchCountEl.textContent = matchCount;
                clearBtn.style.display = 'inline-flex';
                
                const shouldShowExtra = hasSinglePass || matchCount >= 2;
                
                if (!shouldShowExtra) {
                    betExtra.classList.remove('show');
                    betTip.textContent = '还需选择' + (2 - matchCount) + '场';
                    betTip.style.color = 'var(--warning)';
                } else {
                    betExtra.classList.add('show');
                    betTip.textContent = '已满足最低要求';
                    betTip.style.color = 'var(--success)';
                    
                    if (matchCount !== prevMatchCount) {
                        currentPassType = hasSinglePass ? 0 : matchCount - 1;
                        if (currentPassType < 0) currentPassType = 0;
                        prevMatchCount = matchCount;
                    }
                    
                    renderPassOptions(matchCount);
                    
                    const { totalBets, totalBonus } = calculateBonus(selectedOdds, matchCount);
                    document.getElementById('bet-count').textContent = totalBets;
                    document.getElementById('bet-money').textContent = (totalBets * 2 * times).toFixed(0);
                    document.getElementById('bonus-amount').textContent = totalBonus.toFixed(2);
                }
            } else {
                bottomBar.classList.remove('show');
                setTimeout(() => {
                    if (!bottomBar.classList.contains('show')) {
                        bottomBar.style.display = 'none';
                    }
                }, 300);
                betExtra.classList.remove('show');
                currentPassType = 0;
                prevMatchCount = 0;
            }
        }
        
        function renderPassOptions(matchCount) {
            const container = document.getElementById('pass-options');
            let html = '';
            
            passOptions.forEach((opt, idx) => {
                const disabled = opt.value > matchCount ? 'disabled' : '';
                const selected = currentPassType === idx ? 'selected' : '';
                if (opt.value <= 8) {
                    html += '<button class="pass-option ' + selected + '" ' + disabled + ' onclick="selectPass(' + idx + ')">' + opt.label + '</button>';
                }
            });
            
            container.innerHTML = html;
            
            if (currentPassType >= matchCount && matchCount > 0) {
                currentPassType = matchCount - 1;
                if (currentPassType < 0) currentPassType = 0;
            }
        }
        
        function selectPass(idx) {
            currentPassType = idx;
            updateBottomBar();
        }
        
        function submitBet() {
            let matchCount = 0;
            const selectedOdds = [];
            
            if (currentPlayType === 'mixed') {
                for (const id in selections) {
                    const sel = selections[id];
                    const m = getMatch(id);
                    if (!m) continue;
                    let odds = [];
                    if (sel.spf.length > 0 && m.spf) odds = odds.concat(sel.spf.map(i => m.spf[i]));
                    if (sel.rqspf.length > 0 && m.rqspf) odds = odds.concat(sel.rqspf.map(i => m.rqspf.odds[i]));
                    if (sel.bf.length > 0 && m.bf) odds = odds.concat(sel.bf.map(i => m.bf[i]));
                    if (sel.zjq.length > 0 && m.zjq) odds = odds.concat(sel.zjq.map(i => m.zjq[i]));
                    if (sel.bqc.length > 0 && m.bqc) odds = odds.concat(sel.bqc.map(i => m.bqc[i]));
                    if (odds.length > 0) { matchCount++; selectedOdds.push(odds); }
                }
            } else {
                for (const id in selections) {
                    const sel = selections[id][currentPlayType];
                    if (sel.length > 0) {
                        matchCount++;
                        const m = getMatch(id);
                        if (!m) continue;
                        let odds = [];
                        if (currentPlayType === 'spf') odds = sel.map(i => m.spf[i]);
                        else if (currentPlayType === 'rqspf') odds = sel.map(i => m.rqspf.odds[i]);
                        else if (currentPlayType === 'bf') odds = sel.map(i => m.bf[i]);
                        else if (currentPlayType === 'zjq') odds = sel.map(i => m.zjq[i]);
                        else if (currentPlayType === 'bqc') odds = sel.map(i => m.bqc[i]);
                        selectedOdds.push(odds);
                    }
                }
            }
            
            const passLabel = passOptions[currentPassType]?.label || '';
            const { totalBets, totalBonus } = calculateBonus(selectedOdds, matchCount);
            const totalMoney = totalBets * 2 * times;
            
            let confirmMsg = '投注确认\n\n';
            confirmMsg += '过关方式：' + passLabel + '\n';
            confirmMsg += '已选场次：' + matchCount + ' 场\n';
            confirmMsg += '投注注数：' + totalBets + ' 注\n';
            confirmMsg += '投注倍数：' + times + ' 倍\n';
            confirmMsg += '投注金额：' + totalMoney + ' 元\n';
            confirmMsg += '预计奖金：' + totalBonus.toFixed(2) + ' 元\n\n';
            confirmMsg += '是否确认投注？';
            
            if (confirm(confirmMsg)) {
                alert('投注成功！\n\n' + passLabel + ' - 共 ' + totalBets + ' 注，' + totalMoney + ' 元');
                for (const id in selections) {
                    selections[id] = { spf: [], rqspf: [], bf: [], zjq: [], bqc: [] };
                }
                times = 1;
                currentPassType = 0;
                document.getElementById('times-input').value = 1;
                renderMatches();
                updateBottomBar();
            }
        }
        
        function calculateBonus(selectedOdds, matchCount) {
            if (selectedOdds.length === 0 || currentPassType >= passOptions.length) {
                return { totalBets: 0, totalBonus: 0 };
            }
            
            const passValue = passOptions[currentPassType].value;
            
            if (passValue === 1) {
                let totalBets = 0;
                let totalBonus = 0;
                selectedOdds.forEach(oddsArr => {
                    oddsArr.forEach(odd => {
                        totalBets++;
                        totalBonus += odd * 2 * times;
                    });
                });
                return { totalBets, totalBonus };
            }
            
            if (passValue > matchCount) {
                return { totalBets: 0, totalBonus: 0 };
            }
            
            const combinations = getCombinations(selectedOdds, passValue);
            let totalBets = 0;
            let totalBonus = 0;
            
            combinations.forEach(combo => {
                const bets = combo.reduce((acc, arr) => acc * arr.length, 1);
                totalBets += bets;
                
                const oddsProducts = getOddsProducts(combo);
                oddsProducts.forEach(product => {
                    let bonus = product * 2 * times;
                    const limit = bonusLimits[passValue] || 1000000;
                    if (bonus > limit) bonus = limit;
                    totalBonus += bonus;
                });
            });
            
            return { totalBets, totalBonus };
        }
        
        function getCombinations(arr, size) {
            const result = [];
            
            function combine(start, combo) {
                if (combo.length === size) {
                    result.push([...combo]);
                    return;
                }
                for (let i = start; i < arr.length; i++) {
                    combo.push(arr[i]);
                    combine(i + 1, combo);
                    combo.pop();
                }
            }
            
            combine(0, []);
            return result;
        }
        
        function getOddsProducts(oddsArrays) {
            const result = [];
            
            function multiply(idx, product) {
                if (idx === oddsArrays.length) {
                    result.push(product);
                    return;
                }
                oddsArrays[idx].forEach(odd => {
                    multiply(idx + 1, product * odd);
                });
            }
            
            multiply(0, 1);
            return result;
        }
        
        async function init() {
            updateTime();
            document.getElementById('match-list').innerHTML = renderSkeleton(5);
            await fetchFixtureMapping();
            await fetchSinglePassStatus();
            const success = await fetchMatchData();
            if (!success) {
                document.getElementById('match-list').innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);"><svg style="width:48px;height:48px;margin-bottom:12px;opacity:0.5;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div>数据加载失败，请刷新重试</div></div>';
            }
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(async () => {
                await fetchSinglePassStatus();
                await fetchMatchData();
                updateTime();
                updateBottomBar();
            }, 120000);
        }
        
        init();
        
        document.getElementById('times-minus').addEventListener('click', () => {
            if (times > 1) {
                times--;
                document.getElementById('times-input').value = times;
                updateBottomBar();
            }
        });
        
        document.getElementById('times-plus').addEventListener('click', () => {
            if (times < 50) {
                times++;
                document.getElementById('times-input').value = times;
                updateBottomBar();
            }
        });
        
        document.getElementById('times-input').addEventListener('change', (e) => {
            let val = parseInt(e.target.value) || 1;
            if (val < 1) val = 1;
            if (val > 50) val = 50;
            times = val;
            e.target.value = times;
            updateBottomBar();
        });
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            for (const id in selections) {
                selections[id] = { spf: [], rqspf: [], bf: [], zjq: [], bqc: [] };
            }
            times = 1;
            document.getElementById('times-input').value = 1;
            renderMatches();
            updateBottomBar();
        });
        
        document.getElementById('submit-btn').addEventListener('click', submitBet);
    </script>
