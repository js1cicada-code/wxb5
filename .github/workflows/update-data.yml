name: Update Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
          pip install playwright
          python -m playwright install chromium
      
      - name: Run all crawlers
        run: |
          python live_crawler_final.py || true
          python live_basketball_crawler.py || true
          python data_fetcher.py || true
          python bjdc_crawler.py || true
          python dlt_crawler.py || true
          python qxc_crawler.py || true
          python ctzc_crawler.py || true
          python bqc6_crawler.py || true
          python zjq4_crawler.py || true
          python basketball_analysis_crawler.py || true
      
      - name: Copy to dist
        run: |
          mkdir -p dist/data
          cp data/*.json dist/data/ 2>/dev/null || true
          cp data/*.json dist/ 2>/dev/null || true
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ dist/ update.log 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update data - $(date '+%Y-%m-%d %H:%M')"
          git push